<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alunos — picpay.de.i</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="../assets/js/firebase-config.js"></script>
  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/components.js"></script>

  <div id="app"></div>

  <script>
    document.getElementById('app').innerHTML =
      Components.sidebar('alunos') +
      '<div class="main-content">' +
        Components.topbar('Alunos') +
        '<div class="page-container">' +

          '<div class="card" style="margin-bottom:20px;">' +
            '<div class="card-header"><h3>Cadastrar Aluno</h3></div>' +
            '<div class="card-body">' +
              '<div class="form-row">' +
                '<div class="form-group" style="width:120px;">' +
                  '<label>Nº Chamada</label>' +
                  '<input type="number" id="inputNumero" min="1" placeholder="Nº" />' +
                '</div>' +
                '<div class="form-group" style="flex:1;min-width:200px;">' +
                  '<label>Nome Completo</label>' +
                  '<input type="text" id="inputNome" placeholder="Nome do aluno" />' +
                '</div>' +
                '<button class="btn btn-primary" onclick="addAluno()" style="align-self:flex-end;">+ Adicionar</button>' +
              '</div>' +

              '<div style="margin-top:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;">' +
                '<label class="btn btn-dark" style="cursor:pointer;">' +
                  '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="width:16px;height:16px;"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M7 10l5-5m0 0l5 5m-5-5v12"/></svg>' +
                  ' Importar CSV' +
                  '<input type="file" accept=".csv" onchange="importCSV(event)" style="display:none;" />' +
                '</label>' +
                '<span style="font-size:0.75rem;color:var(--gray-400);">Formato: numero,nome,negativos</span>' +
                '<button class="btn btn-outline" onclick="addSampleData()" style="margin-left:auto;">Dados de Exemplo</button>' +
                '<button class="btn btn-outline" onclick="copyFromPrevBim()" style="font-size:0.78rem;">Copiar do Bim. Anterior</button>' +
              '</div>' +
            '</div>' +
          '</div>' +

          '<div class="card">' +
            '<div class="card-header">' +
              '<h3>Lista de Alunos</h3>' +
              '<div style="display:flex;align-items:center;gap:12px;">' +
                '<span style="font-size:0.8rem;color:var(--gray-400);font-weight:600;" id="countLabel">0 alunos</span>' +
                '<button class="btn btn-danger" onclick="clearAllStudents()" style="font-size:0.75rem;padding:6px 12px;">Apagar Todos</button>' +
              '</div>' +
            '</div>' +
            '<div class="table-container">' +
              '<table>' +
                '<thead>' +
                  '<tr>' +
                    '<th style="text-align:left;">Nº</th>' +
                    '<th style="text-align:left;">Nome</th>' +
                    '<th style="text-align:center;">Negativos</th>' +
                    '<th style="text-align:center;">Média</th>' +
                    '<th style="text-align:center;">Ações</th>' +
                  '</tr>' +
                '</thead>' +
                '<tbody id="tbodyAlunos"></tbody>' +
              '</table>' +
              '<div id="emptyState" class="empty-state">Nenhum aluno cadastrado. Adicione acima ou importe um CSV.</div>' +
            '</div>' +
          '</div>' +

        '</div>' +
        Components.footer() +
      '</div>';

    initSelects();

    function onContextChange() { render(); }

    function addAluno() {
      var ctx = getCurrentContext();
      var numero = parseInt(document.getElementById('inputNumero').value);
      var nome = document.getElementById('inputNome').value.trim();
      if (!numero || !nome) return alert('Preencha o número e o nome.');
      if (!Store.addStudent(ctx.turma, ctx.materia, ctx.bimestre, numero, nome)) return alert('Já existe um aluno com esse número.');
      document.getElementById('inputNumero').value = '';
      document.getElementById('inputNome').value = '';
      render();
    }

    function removeAluno(numero) {
      if (!confirm('Remover este aluno?')) return;
      var ctx = getCurrentContext();
      Store.removeStudent(ctx.turma, ctx.materia, ctx.bimestre, numero);
      render();
    }

    function importCSV(event) {
      var file = event.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function(e) {
        var ctx = getCurrentContext();
        var count = Store.importCSV(ctx.turma, ctx.materia, ctx.bimestre, e.target.result);
        alert(count + ' aluno(s) importado(s).');
        render();
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    function addSampleData() {
      var ctx = getCurrentContext();
      var names = ['Ana Silva', 'Bruno Costa', 'Carla Souza', 'Daniel Lima', 'Eduarda Santos',
        'Felipe Oliveira', 'Gabriela Martins', 'Henrique Rocha', 'Isabela Ferreira', 'João Pedro Alves',
        'Kamila Dias', 'Lucas Ribeiro', 'Maria Clara Gomes', 'Nathan Barbosa', 'Olivia Cardoso'];
      names.forEach(function(nome, i) {
        Store.addStudent(ctx.turma, ctx.materia, ctx.bimestre, i + 1, nome);
      });
      render();
    }

    function copyFromPrevBim() {
      var ctx = getCurrentContext();
      var bimNum = parseInt(ctx.bimestre);
      if (bimNum <= 1) return alert('Não há bimestre anterior ao 1º.');
      var prevBim = String(bimNum - 1);
      var count = Store.copyStudentsToBimestre(ctx.turma, ctx.materia, prevBim, ctx.bimestre);
      if (count === 0) alert('Nenhum aluno novo para copiar.');
      else alert(count + ' aluno(s) copiado(s) do ' + Store.BIMESTRE_LABELS[prevBim] + '.');
      render();
    }

    function clearAllStudents() {
      var ctx = getCurrentContext();
      var students = Store.getStudents(ctx.turma, ctx.materia, ctx.bimestre);
      if (students.length === 0) return alert('Não há alunos para apagar.');
      if (!confirm('Apagar TODOS os ' + students.length + ' alunos da turma ' + ctx.turma + ' (' + Store.BIMESTRE_LABELS[ctx.bimestre] + ') de TODAS as matérias?')) return;
      var materias = Store.getMaterias(ctx.turma);
      materias.forEach(function(mat) {
        Store.setStudents(ctx.turma, mat, ctx.bimestre, []);
      });
      render();
    }

    function buildRow(s) {
      var media = Store.calcMedia(s);
      var colorClass = media >= 6 ? 'badge-green' : 'badge-red';
      var negColor = s.negativos > 0 ? 'var(--red)' : 'var(--gray-400)';

      return '<tr>' +
        '<td style="font-weight:700;color:var(--dark);">' + s.numero + '</td>' +
        '<td>' + s.nome + '</td>' +
        '<td style="text-align:center;"><span style="font-weight:700;color:' + negColor + ';">' + s.negativos + '</span></td>' +
        '<td style="text-align:center;"><span class="badge ' + colorClass + '">' + media + '</span></td>' +
        '<td style="text-align:center;">' +
          '<button onclick="removeAluno(' + s.numero + ')" class="btn-icon-sm" style="background:#FEE2E2;color:var(--red);" title="Remover">' +
            '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="width:16px;height:16px;"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>' +
          '</button>' +
        '</td>' +
      '</tr>';
    }

    function render() {
      var ctx = getCurrentContext();
      var students = Store.getStudents(ctx.turma, ctx.materia, ctx.bimestre);
      var tbody = document.getElementById('tbodyAlunos');
      var empty = document.getElementById('emptyState');
      document.getElementById('countLabel').textContent = students.length + ' aluno(s)';

      if (students.length === 0) {
        tbody.innerHTML = '';
        empty.style.display = '';
        return;
      }
      empty.style.display = 'none';

      tbody.innerHTML = students.map(buildRow).join('');
    }

    document.getElementById('inputNome').addEventListener('keydown', function(e) { if (e.key === 'Enter') addAluno(); });
    document.getElementById('inputNumero').addEventListener('keydown', function(e) { if (e.key === 'Enter') document.getElementById('inputNome').focus(); });

    render();
    Store.loadFromCloud(function(success) { if (success) render(); });
  </script>
</body>
</html>
