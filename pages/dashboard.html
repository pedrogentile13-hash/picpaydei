<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — picpay.de.i</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    .filter-btn {
      padding: 7px 16px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 600;
      border: 1px solid var(--gray-200);
      background: #fff;
      color: var(--gray-700);
      cursor: pointer;
      transition: all 0.15s;
    }
    .filter-btn:hover { background: var(--gray-50); border-color: var(--gray-300); }
    .filter-btn.active {
      background: var(--green);
      color: #fff;
      border-color: var(--green);
    }
    .filter-sub select {
      border: 1px solid var(--gray-200);
      border-radius: 10px;
      padding: 7px 12px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--dark);
      cursor: pointer;
    }
    .filter-sub select:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px rgba(17,199,111,0.15); }
  </style>
</head>
<body>
  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/components.js"></script>

  <div id="app"></div>

  <script>
    var settings = Store.getSettings();
    var bimOptions = Store.BIMESTRES.map(function(b) {
      return '<option value="' + b + '"' + (b === settings.bimestre ? ' selected' : '') + '>' + Store.BIMESTRE_LABELS[b] + '</option>';
    }).join('');

    document.getElementById('app').innerHTML =
      Components.sidebar('dashboard') +
      '<div class="main-content">' +
        '<header class="topbar">' +
          '<div style="display:flex;align-items:center;gap:12px;">' +
            '<button class="hamburger" onclick="toggleSidebar()">' +
              '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>' +
            '</button>' +
            '<div><h2 class="topbar-title">Dashboard</h2>' +
            '<span style="font-size:0.65rem;color:var(--gray-400);font-weight:600;">Ano Letivo ' + Store.ANO_LETIVO + '</span></div>' +
          '</div>' +
        '</header>' +
        '<div class="page-container">' +

          '<!-- Filters -->' +
          '<div class="card" style="margin-bottom:20px;">' +
            '<div class="card-body" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">' +
              '<span style="font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--gray-400);">Visualizar:</span>' +
              '<button class="filter-btn active" onclick="setFilter(\'geral\')" id="fbtn-geral">Geral</button>' +
              '<button class="filter-btn" onclick="setFilter(\'sala\')" id="fbtn-sala">Por Sala</button>' +
              '<button class="filter-btn" onclick="setFilter(\'ano\')" id="fbtn-ano">Por Ano</button>' +
              '<button class="filter-btn" onclick="setFilter(\'materia\')" id="fbtn-materia">Por Matéria</button>' +

              '<div class="filter-sub" id="filterSub" style="display:none;margin-left:8px;">' +
                '<select id="filterValue" onchange="render()"></select>' +
              '</div>' +

              '<div style="margin-left:auto;">' +
                '<select id="dashBimestre" onchange="render()" style="border:1px solid var(--gray-200);border-radius:10px;padding:7px 12px;font-size:0.8rem;font-weight:600;color:var(--dark);cursor:pointer;">' +
                  bimOptions +
                '</select>' +
              '</div>' +
            '</div>' +
          '</div>' +

          '<!-- Summary Cards -->' +
          '<div class="summary-grid" id="summaryGrid">' +
            '<div class="summary-card">' +
              '<div class="label">Total de Alunos</div>' +
              '<div class="value dark" id="card-total">0</div>' +
            '</div>' +
            '<div class="summary-card">' +
              '<div class="label">Total de Negativos</div>' +
              '<div class="value red" id="card-negativos">0</div>' +
            '</div>' +
            '<div class="summary-card">' +
              '<div class="label">Média Geral</div>' +
              '<div class="value green" id="card-media">0.0</div>' +
            '</div>' +
            '<div class="summary-card">' +
              '<div class="label">Abaixo da Média (6.0)</div>' +
              '<div class="value orange" id="card-abaixo">0</div>' +
            '</div>' +
          '</div>' +

          '<!-- Charts Row -->' +
          '<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px;" id="chartsRow">' +
            '<div class="card">' +
              '<div class="card-header"><h3>Aprovados vs Reprovados</h3></div>' +
              '<div class="card-body" style="display:flex;flex-direction:column;align-items:center;">' +
                '<div style="max-width:260px;width:100%;"><canvas id="chartDoughnut"></canvas></div>' +
                '<div style="display:flex;gap:24px;margin-top:16px;font-size:0.75rem;font-weight:600;">' +
                  '<span style="display:flex;align-items:center;gap:6px;"><span style="width:12px;height:12px;border-radius:50%;background:var(--green);display:inline-block;"></span>Aprovados: <span id="leg-a">0</span></span>' +
                  '<span style="display:flex;align-items:center;gap:6px;"><span style="width:12px;height:12px;border-radius:50%;background:#F87171;display:inline-block;"></span>Reprovados: <span id="leg-r">0</span></span>' +
                '</div>' +
              '</div>' +
            '</div>' +
            '<div class="card">' +
              '<div class="card-header"><h3>Distribuição de Notas</h3></div>' +
              '<div class="card-body"><canvas id="chartBar"></canvas></div>' +
            '</div>' +
          '</div>' +

          '<!-- Ranking -->' +
          '<div class="card">' +
            '<div class="card-header"><h3>Ranking — Top 5 Menos Negativos</h3></div>' +
            '<div class="card-body">' +
              '<div id="rankingList" style="display:flex;flex-direction:column;gap:10px;">' +
                '<div class="empty-state">Nenhum dado disponível.</div>' +
              '</div>' +
            '</div>' +
          '</div>' +

        '</div>' +
        Components.footer() +
      '</div>';

    var currentFilterMode = 'geral';
    var doughnutChart = null;
    var barChart = null;

    function setFilter(mode) {
      currentFilterMode = mode;
      // Update button states
      ['geral', 'sala', 'ano', 'materia'].forEach(function(m) {
        document.getElementById('fbtn-' + m).className = 'filter-btn' + (m === mode ? ' active' : '');
      });

      var sub = document.getElementById('filterSub');
      var sel = document.getElementById('filterValue');

      if (mode === 'geral') {
        sub.style.display = 'none';
      } else {
        sub.style.display = '';
        var options = '';
        if (mode === 'sala') {
          options = Store.TURMAS.map(function(t) {
            return '<option value="' + t + '">' + t.replace(/(\d)(\w)/, '$1º$2') + '</option>';
          }).join('');
        } else if (mode === 'ano') {
          options = '<option value="8">8º Ano</option><option value="9">9º Ano</option>';
        } else if (mode === 'materia') {
          var all = ['Português', 'Produção', 'LEM'];
          options = all.map(function(m) {
            return '<option value="' + m + '">' + m + '</option>';
          }).join('');
        }
        sel.innerHTML = options;
      }
      render();
    }

    function getFilter() {
      var bim = document.getElementById('dashBimestre').value;
      var val = '';
      if (currentFilterMode !== 'geral') {
        val = document.getElementById('filterValue').value;
      }
      return { mode: currentFilterMode, value: val, bimestre: bim };
    }

    function render() {
      var filter = getFilter();
      var stats = Store.getFilteredStats(filter);
      var students = Store.getFilteredStudents(filter);

      document.getElementById('card-total').textContent = stats.totalAlunos;
      document.getElementById('card-negativos').textContent = stats.totalNegativos;
      document.getElementById('card-media').textContent = stats.media;
      document.getElementById('card-abaixo').textContent = stats.abaixo;
      document.getElementById('leg-a').textContent = stats.aprovados;
      document.getElementById('leg-r').textContent = stats.abaixo;

      // Doughnut
      if (doughnutChart) doughnutChart.destroy();
      doughnutChart = new Chart(document.getElementById('chartDoughnut'), {
        type: 'doughnut',
        data: {
          labels: ['Aprovados', 'Reprovados'],
          datasets: [{ data: [stats.aprovados, stats.abaixo], backgroundColor: ['#11C76F', '#F87171'], borderWidth: 0, hoverOffset: 8 }],
        },
        options: { cutout: '65%', responsive: true, plugins: { legend: { display: false } } },
      });

      // Bar chart
      var ranges = ['0-2', '2-4', '4-6', '6-8', '8-10'];
      var counts = [0, 0, 0, 0, 0];
      students.forEach(function(s) {
        if (s.media < 2) counts[0]++;
        else if (s.media < 4) counts[1]++;
        else if (s.media < 6) counts[2]++;
        else if (s.media < 8) counts[3]++;
        else counts[4]++;
      });
      if (barChart) barChart.destroy();
      barChart = new Chart(document.getElementById('chartBar'), {
        type: 'bar',
        data: {
          labels: ranges,
          datasets: [{
            label: 'Alunos',
            data: counts,
            backgroundColor: ['#FCA5A5', '#FDBA74', '#FCD34D', '#86EFAC', '#11C76F'],
            borderRadius: 8,
            borderSkipped: false,
          }],
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: {
            y: { beginAtZero: true, ticks: { stepSize: 1 } },
            x: { grid: { display: false } },
          },
        },
      });

      // Ranking
      var list = document.getElementById('rankingList');
      if (students.length === 0) {
        list.innerHTML = '<div class="empty-state">Nenhum dado disponível para este filtro.</div>';
        return;
      }
      var sorted = students.slice().sort(function(a, b) { return a.negativos - b.negativos; }).slice(0, 5);
      var medals = ['\u{1F947}', '\u{1F948}', '\u{1F949}', '4\u00BA', '5\u00BA'];
      list.innerHTML = sorted.map(function(s, i) {
        var turmaLabel = s.turma.replace(/(\d)(\w)/, '$1\u00BA$2');
        return '<div class="ranking-item">' +
          '<div class="left">' +
            '<span class="medal">' + medals[i] + '</span>' +
            '<div>' +
              '<div class="name">' + s.nome + '</div>' +
              '<div class="sub">N\u00BA ' + s.numero + ' &mdash; ' + turmaLabel + ' &mdash; ' + s.materia + '</div>' +
            '</div>' +
          '</div>' +
          '<span class="neg-count" style="color:' + (s.negativos === 0 ? 'var(--green)' : 'var(--orange)') + '">' + s.negativos + ' neg.</span>' +
        '</div>';
      }).join('');
    }

    render();
  </script>
</body>
</html>
