<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — picpay.de.i</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/components.js"></script>

  <script>
    document.body.innerHTML = `
      ${Components.sidebar('dashboard')}
      <div class="main-content">
        ${Components.topbar('Dashboard')}
        <div class="page-container">

          <!-- Summary Cards -->
          <div class="summary-grid" id="summaryGrid">
            <div class="summary-card">
              <div class="label">Total de Alunos</div>
              <div class="value dark" id="card-total">0</div>
            </div>
            <div class="summary-card">
              <div class="label">Total de Negativos</div>
              <div class="value red" id="card-negativos">0</div>
            </div>
            <div class="summary-card">
              <div class="label">Média da Turma</div>
              <div class="value green" id="card-media">0.0</div>
            </div>
            <div class="summary-card">
              <div class="label">Abaixo da Média (6.0)</div>
              <div class="value orange" id="card-abaixo">0</div>
            </div>
          </div>

          <!-- Charts Row -->
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px;" id="chartsRow">
            <!-- Doughnut -->
            <div class="card">
              <div class="card-header"><h3>Aprovados vs Reprovados</h3></div>
              <div class="card-body" style="display:flex;flex-direction:column;align-items:center;">
                <div style="max-width:260px;width:100%;"><canvas id="chartDoughnut"></canvas></div>
                <div style="display:flex;gap:24px;margin-top:16px;font-size:0.75rem;font-weight:600;">
                  <span style="display:flex;align-items:center;gap:6px;"><span style="width:12px;height:12px;border-radius:50%;background:var(--green);display:inline-block;"></span>Aprovados: <span id="leg-a">0</span></span>
                  <span style="display:flex;align-items:center;gap:6px;"><span style="width:12px;height:12px;border-radius:50%;background:#F87171;display:inline-block;"></span>Reprovados: <span id="leg-r">0</span></span>
                </div>
              </div>
            </div>

            <!-- Bar chart -->
            <div class="card">
              <div class="card-header"><h3>Distribuição de Notas</h3></div>
              <div class="card-body">
                <canvas id="chartBar"></canvas>
              </div>
            </div>
          </div>

          <!-- Ranking -->
          <div class="card">
            <div class="card-header"><h3>Ranking — Top 5 Menos Negativos</h3></div>
            <div class="card-body">
              <div id="rankingList" style="display:flex;flex-direction:column;gap:10px;">
                <div class="empty-state">Nenhum aluno cadastrado nesta turma/matéria.</div>
              </div>
            </div>
          </div>

        </div>
        ${Components.footer()}
      </div>
    `;

    initSelects();

    let doughnutChart = null;
    let barChart = null;

    function onContextChange() { render(); }

    function render() {
      const { turma, materia } = getCurrentContext();
      const students = Store.getStudents(turma, materia);
      const total = students.length;
      const totalNegs = students.reduce((s, a) => s + a.negativos, 0);
      const totals = students.map(s => Store.calcTotal(s));
      const media = total > 0 ? (totals.reduce((a, b) => a + b, 0) / total) : 0;
      const abaixo = totals.filter(t => t < 6).length;
      const aprovados = total - abaixo;

      document.getElementById('card-total').textContent = total;
      document.getElementById('card-negativos').textContent = totalNegs;
      document.getElementById('card-media').textContent = media.toFixed(1);
      document.getElementById('card-abaixo').textContent = abaixo;
      document.getElementById('leg-a').textContent = aprovados;
      document.getElementById('leg-r').textContent = abaixo;

      // Doughnut
      if (doughnutChart) doughnutChart.destroy();
      doughnutChart = new Chart(document.getElementById('chartDoughnut'), {
        type: 'doughnut',
        data: {
          labels: ['Aprovados', 'Reprovados'],
          datasets: [{ data: [aprovados, abaixo], backgroundColor: ['#11C76F', '#F87171'], borderWidth: 0, hoverOffset: 8 }],
        },
        options: { cutout: '65%', responsive: true, plugins: { legend: { display: false } } },
      });

      // Bar chart — grade distribution
      const ranges = ['0-2', '2-4', '4-6', '6-8', '8-10'];
      const counts = [0, 0, 0, 0, 0];
      totals.forEach(t => {
        if (t < 2) counts[0]++;
        else if (t < 4) counts[1]++;
        else if (t < 6) counts[2]++;
        else if (t < 8) counts[3]++;
        else counts[4]++;
      });
      if (barChart) barChart.destroy();
      barChart = new Chart(document.getElementById('chartBar'), {
        type: 'bar',
        data: {
          labels: ranges,
          datasets: [{
            label: 'Alunos',
            data: counts,
            backgroundColor: ['#FCA5A5', '#FDBA74', '#FCD34D', '#86EFAC', '#11C76F'],
            borderRadius: 8,
            borderSkipped: false,
          }],
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: {
            y: { beginAtZero: true, ticks: { stepSize: 1 } },
            x: { grid: { display: false } },
          },
        },
      });

      // Ranking
      const list = document.getElementById('rankingList');
      if (students.length === 0) {
        list.innerHTML = '<div class="empty-state">Nenhum aluno cadastrado nesta turma/matéria.</div>';
        return;
      }
      const sorted = [...students].sort((a, b) => a.negativos - b.negativos).slice(0, 5);
      const medals = ['🥇', '🥈', '🥉', '4º', '5º'];
      list.innerHTML = sorted.map((s, i) => `
        <div class="ranking-item">
          <div class="left">
            <span class="medal">${medals[i]}</span>
            <div>
              <div class="name">${s.nome}</div>
              <div class="sub">Nº ${s.numero}</div>
            </div>
          </div>
          <span class="neg-count" style="color:${s.negativos === 0 ? 'var(--green)' : 'var(--orange)'}">${s.negativos} neg.</span>
        </div>
      `).join('');
    }

    render();
  </script>
</body>
</html>
