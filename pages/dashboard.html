<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Lidara</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <style>
    .filter-btn { padding:8px 16px; border-radius:10px; font-size:0.78rem; font-weight:600; border:1px solid var(--border); background:#fff; color:var(--gray-500); cursor:pointer; transition:all 0.15s; }
    .filter-btn:hover { border-color:var(--lidara-green); color:var(--lidara-green); }
    .filter-btn.active { background:var(--lidara-green); color:#fff; border-color:var(--lidara-green); }
    .stat-highlight { background:linear-gradient(135deg, var(--lidara-dark), #007755); color:#fff; }
    .stat-highlight .label { color:rgba(255,255,255,0.6); }
    .stat-highlight .value { color:#fff; }
    .filter-select { padding:8px 12px; border-radius:10px; font-size:0.78rem; font-weight:600; border:1px solid var(--border); background:#fff; color:var(--gray-500); cursor:pointer; outline:none; transition:all 0.15s; }
    .filter-select:focus { border-color:var(--lidara-green); }
    #dashboardLoading { padding:80px 20px; text-align:center; color:var(--gray-400); font-size:0.95rem; }
  </style>
</head>
<body>
  <script src="../assets/js/firebase-config.js"></script>
  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/auth-guard.js"></script>

  <div id="app" style="visibility:hidden;">
    <div id="dashboardLoading">Carregando...</div>
  </div>

  <script>
    var currentFilter = { mode: 'geral', value: '', bimestre: '1' };
    var chartDoughnut = null;
    var chartBar = null;

    function buildDashboard() {
      try {
        var settings = Store.getSettings();
        currentFilter.bimestre = settings.bimestre || '1';

        var bimOpts = Store.BIMESTRES.map(function(b) {
          return '<option value="' + b + '"' + (b === settings.bimestre ? ' selected' : '') + '>' + Store.BIMESTRE_LABELS[b] + '</option>';
        }).join('');

        var turmas = Store.TURMAS;
        var salaOpts = '<option value="">Todas as salas...</option>' +
          turmas.map(function(t) {
            return '<option value="' + t + '">' + Store.formatTurma(t) + '</option>';
          }).join('');

        // Build year filter buttons from configured turmas
        var anosSet = {};
        turmas.forEach(function(t) { anosSet[t.charAt(0)] = true; });
        var anos = Object.keys(anosSet).sort();
        var anoBtns = anos.map(function(a) {
          return '<button class="filter-btn" onclick="setFilter(\'ano\',\'' + a + '\')" id="fbtn-ano-' + a + '">' + a + '\u00ba Ano</button>';
        }).join('');

        // Build materia filter buttons
        var materias = Store.getAllMaterias();
        var materiaBtns = materias.map(function(m) {
          var safeId = m.replace(/[^a-zA-Z0-9]/g, '_');
          return '<button class="filter-btn" onclick="setFilter(\'materia\',\'' + m.replace(/'/g, "\\'") + '\')" id="fbtn-materia-' + safeId + '">' + m + '</button>';
        }).join('');

        document.getElementById('app').innerHTML =
          Components.topnav('dashboard') +
          '<div class="main-content">' +
            '<div class="subheader">' +
              '<h2 class="subheader-title">Dashboard</h2>' +
              '<div class="subheader-controls">' +
                '<div class="subheader-select">' +
                  '<label>Bimestre</label>' +
                  '<select id="dashBimestre" onchange="onFilterChange()">' + bimOpts + '</select>' +
                '</div>' +
              '</div>' +
            '</div>' +
            '<div class="page-container">' +

              '<div class="card" style="margin-bottom:20px;">' +
                '<div class="card-body" style="padding:16px 20px;">' +
                  '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">' +
                    '<span style="font-size:0.72rem;font-weight:700;color:var(--gray-400);text-transform:uppercase;letter-spacing:0.05em;margin-right:8px;">Filtro:</span>' +
                    '<button class="filter-btn active" onclick="setFilter(\'geral\',\'\')" id="fbtn-geral">Geral</button>' +
                    '<select class="filter-select" id="salaDropdown" onchange="onSalaDropdownChange()">' + salaOpts + '</select>' +
                  '</div>' +
                  (anoBtns ? '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;">' +
                    '<span style="font-size:0.72rem;font-weight:700;color:var(--gray-400);text-transform:uppercase;letter-spacing:0.05em;margin-right:8px;">Por Ano:</span>' +
                    anoBtns +
                  '</div>' : '') +
                  (materiaBtns ? '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;">' +
                    '<span style="font-size:0.72rem;font-weight:700;color:var(--gray-400);text-transform:uppercase;letter-spacing:0.05em;margin-right:8px;">Por Mat\u00e9ria:</span>' +
                    materiaBtns +
                  '</div>' : '') +
                '</div>' +
              '</div>' +

              '<div class="summary-grid" style="grid-template-columns:repeat(5,1fr);">' +
                '<div class="summary-card"><div class="label">Total de Alunos</div><div class="value dark" id="c-total">0</div></div>' +
                '<div class="summary-card"><div class="label">Total Negativos</div><div class="value red" id="c-negs">0</div></div>' +
                '<div class="summary-card"><div class="label">M\u00e9dia Geral</div><div class="value green" id="c-media">0.0</div></div>' +
                '<div class="summary-card"><div class="label">Abaixo da M\u00e9dia</div><div class="value orange" id="c-abaixo">0</div></div>' +
                '<div class="summary-card stat-highlight"><div class="label">Melhor Nota</div><div class="value" id="c-melhor">0.0</div><div style="font-size:0.7rem;opacity:0.7;margin-top:2px;" id="c-melhor-nome">\u2014</div></div>' +
              '</div>' +

              '<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px;">' +
                '<div class="card"><div class="card-header"><h3>Aprovados vs Reprovados</h3></div>' +
                  '<div class="card-body" style="display:flex;justify-content:center;"><div style="max-width:260px;width:100%;"><canvas id="chartDoughnut"></canvas></div></div>' +
                  '<div style="display:flex;justify-content:center;gap:24px;padding:0 20px 16px;font-size:0.75rem;font-weight:600;">' +
                    '<span style="display:flex;align-items:center;gap:6px;"><span style="width:10px;height:10px;border-radius:50%;background:var(--lidara-green);display:inline-block;"></span>Aprovados: <span id="leg-ap">0</span></span>' +
                    '<span style="display:flex;align-items:center;gap:6px;"><span style="width:10px;height:10px;border-radius:50%;background:#F87171;display:inline-block;"></span>Reprovados: <span id="leg-rp">0</span></span>' +
                  '</div>' +
                '</div>' +
                '<div class="card"><div class="card-header"><h3>Distribui\u00e7\u00e3o de M\u00e9dias</h3></div>' +
                  '<div class="card-body"><canvas id="chartBar"></canvas></div>' +
                '</div>' +
              '</div>' +

              '<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">' +
                '<div class="card"><div class="card-header"><h3>Top 5 \u2014 Melhores Notas</h3></div>' +
                  '<div class="card-body" id="rankMelhores"><p style="color:var(--gray-400);font-style:italic;font-size:0.85rem;">Sem dados.</p></div></div>' +
                '<div class="card"><div class="card-header"><h3>Top 5 \u2014 Menos Negativos</h3></div>' +
                  '<div class="card-body" id="rankNegativos"><p style="color:var(--gray-400);font-style:italic;font-size:0.85rem;">Sem dados.</p></div></div>' +
              '</div>' +

            '</div>' +
            Components.footer() +
          '</div>';

        render();
        Store.loadFromCloud(function(success) { if (success) render(); });
      } catch(e) {
        console.error('Dashboard build error:', e);
        document.getElementById('app').innerHTML =
          Components.topnav('dashboard') +
          '<div class="main-content">' +
            '<div class="subheader"><h2 class="subheader-title">Dashboard</h2></div>' +
            '<div class="page-container">' +
              '<div style="padding:80px 20px;text-align:center;color:var(--gray-400);">' +
                '<p style="font-size:1rem;font-weight:600;color:var(--gray-500);">Erro ao carregar dashboard.</p>' +
                '<p style="font-size:0.85rem;margin-top:8px;">Tente recarregar a p\u00e1gina.</p>' +
              '</div>' +
            '</div>' +
          '</div>';
      }
    }

    function setFilter(mode, value) {
      currentFilter.mode = mode;
      currentFilter.value = value;
      document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
      var salaEl = document.getElementById('salaDropdown');
      if (salaEl) salaEl.value = '';

      var id = '';
      if (mode === 'geral') id = 'fbtn-geral';
      else if (mode === 'ano') id = 'fbtn-ano-' + value;
      else if (mode === 'materia') id = 'fbtn-materia-' + value.replace(/[^a-zA-Z0-9]/g, '_');
      var el = document.getElementById(id);
      if (el) el.classList.add('active');
      render();
    }

    function onSalaDropdownChange() {
      var val = document.getElementById('salaDropdown').value;
      if (!val) { setFilter('geral', ''); return; }
      currentFilter.mode = 'sala';
      currentFilter.value = val;
      document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
      render();
    }

    function onFilterChange() {
      var bimEl = document.getElementById('dashBimestre');
      if (bimEl) currentFilter.bimestre = bimEl.value;
      render();
    }

    function buildRankItem(item, idx, field) {
      var medals = ['\uD83E\uDD47', '\uD83E\uDD48', '\uD83E\uDD49', '4\u00ba', '5\u00ba'];
      var valueText = field === 'media' ? item.media.toFixed(1) : item.negativos + ' neg.';
      var valueColor = field === 'media'
        ? (item.media >= 6 ? 'color:var(--lidara-green);' : 'color:#EF4444;')
        : (item.negativos === 0 ? 'color:var(--lidara-green);' : 'color:#F97316;');
      return '<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);">' +
        '<div style="display:flex;align-items:center;gap:12px;">' +
          '<span style="font-size:1.1rem;width:28px;text-align:center;">' + medals[idx] + '</span>' +
          '<div><div style="font-weight:600;font-size:0.85rem;">' + item.nome + '</div>' +
            '<div style="font-size:0.72rem;color:var(--gray-400);">' + Store.formatTurma(item.turma) + ' \u2014 ' + item.materia + '</div></div>' +
        '</div>' +
        '<span style="font-weight:700;font-size:0.9rem;' + valueColor + '">' + valueText + '</span>' +
      '</div>';
    }

    function showEmptyState() {
      var msg = '<div style="padding:48px 20px;text-align:center;color:var(--gray-400);">' +
        '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="width:48px;height:48px;margin:0 auto 16px;display:block;opacity:0.3;"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>' +
        '<p style="font-size:1rem;font-weight:600;color:var(--gray-500);margin-bottom:8px;">Nenhum dado lan\u00e7ado ainda</p>' +
        '<p style="font-size:0.85rem;">Cadastre alunos e lan\u00e7e notas para visualizar o dashboard.</p>' +
        '</div>';
      var fields = ['c-total','c-negs','c-media','c-abaixo','c-melhor'];
      fields.forEach(function(id) { var el = document.getElementById(id); if (el) el.textContent = id === 'c-media' || id === 'c-melhor' ? '0.0' : '0'; });
      var meNome = document.getElementById('c-melhor-nome'); if (meNome) meNome.textContent = '\u2014';
      var lap = document.getElementById('leg-ap'); if (lap) lap.textContent = '0';
      var lrp = document.getElementById('leg-rp'); if (lrp) lrp.textContent = '0';
      var rm = document.getElementById('rankMelhores'); if (rm) rm.innerHTML = msg;
      var rn = document.getElementById('rankNegativos'); if (rn) rn.innerHTML = msg;
      if (chartDoughnut) { chartDoughnut.destroy(); chartDoughnut = null; }
      if (chartBar) { chartBar.destroy(); chartBar = null; }
    }

    function render() {
      try {
        var stats = Store.getFilteredStats(currentFilter);
        if (stats.totalAlunos === 0) { showEmptyState(); return; }

        document.getElementById('c-total').textContent = stats.totalAlunos;
        document.getElementById('c-negs').textContent = stats.totalNegativos;
        document.getElementById('c-media').textContent = stats.media;
        document.getElementById('c-abaixo').textContent = stats.abaixo;
        document.getElementById('c-melhor').textContent = stats.melhorNota.toFixed(1);
        document.getElementById('c-melhor-nome').textContent = stats.melhorAluno ? stats.melhorAluno.nome : '\u2014';
        document.getElementById('leg-ap').textContent = stats.aprovados;
        document.getElementById('leg-rp').textContent = stats.abaixo;

        if (chartDoughnut) chartDoughnut.destroy();
        chartDoughnut = new Chart(document.getElementById('chartDoughnut'), {
          type: 'doughnut',
          data: { labels: ['Aprovados', 'Reprovados'], datasets: [{ data: [stats.aprovados, stats.abaixo], backgroundColor: ['#40c074', '#F87171'], borderWidth: 0, hoverOffset: 8 }] },
          options: { cutout: '65%', responsive: true, plugins: { legend: { display: false } } },
        });

        var filtered = Store.getFilteredStudents(currentFilter);
        var ranges = { '0-2': 0, '2-4': 0, '4-6': 0, '6-8': 0, '8-10': 0 };
        filtered.forEach(function(s) {
          if (s.media < 2) ranges['0-2']++;
          else if (s.media < 4) ranges['2-4']++;
          else if (s.media < 6) ranges['4-6']++;
          else if (s.media < 8) ranges['6-8']++;
          else ranges['8-10']++;
        });

        if (chartBar) chartBar.destroy();
        chartBar = new Chart(document.getElementById('chartBar'), {
          type: 'bar',
          data: { labels: Object.keys(ranges), datasets: [{ label: 'Alunos', data: Object.values(ranges), backgroundColor: ['#FCA5A5', '#FDBA74', '#FDE68A', '#86EFAC', '#40c074'], borderRadius: 6, borderSkipped: false }] },
          options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } }, x: { grid: { display: false } } } },
        });

        var rm = document.getElementById('rankMelhores');
        rm.innerHTML = stats.topMelhores.length > 0
          ? stats.topMelhores.map(function(item, i) { return buildRankItem(item, i, 'media'); }).join('')
          : '<p style="color:var(--gray-400);font-style:italic;font-size:0.85rem;">Sem dados.</p>';

        var rn = document.getElementById('rankNegativos');
        rn.innerHTML = stats.topMenosNegativos.length > 0
          ? stats.topMenosNegativos.map(function(item, i) { return buildRankItem(item, i, 'negativos'); }).join('')
          : '<p style="color:var(--gray-400);font-style:italic;font-size:0.85rem;">Sem dados.</p>';
      } catch(e) {
        console.error('Dashboard render error:', e);
        showEmptyState();
      }
    }

    // Build dashboard once auth guard makes the app visible
    // We hook into the auth state change to know when we're authenticated
    firebase.auth().onAuthStateChanged(function(user) {
      if (user) {
        buildDashboard();
      }
    });
  </script>
</body>
</html>
