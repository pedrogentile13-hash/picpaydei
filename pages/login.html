<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Lidara</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/editorial.css">
  <style>
    body { display: flex; min-height: 100vh; }

    .login-left {
      flex: 1;
      background: var(--ink);
      color: var(--paper);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 40px;
      position: relative;
      overflow: hidden;
    }
    .login-left::before {
      content: "✦";
      position: absolute;
      right: -80px;
      bottom: -80px;
      font-family: 'Instrument Serif', serif;
      font-size: 400px;
      color: var(--accent);
      opacity: 0.15;
      pointer-events: none;
    }
    .login-brand { font-family: 'Instrument Serif', serif; font-size: 32px; font-style: italic; display: flex; align-items: baseline; gap: 4px; }
    .login-brand .star { font-size: 18px; color: var(--accent); }
    .login-tagline { max-width: 400px; }
    .login-tagline h1 { font-family: 'Inter Tight', sans-serif; font-size: clamp(36px, 5vw, 56px); font-weight: 700; line-height: 1; letter-spacing: -0.03em; margin-bottom: 20px; }
    .login-tagline h1 .it { color: var(--accent); }
    .login-tagline p { font-size: 15px; opacity: 0.6; line-height: 1.6; }
    .login-footer { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.4; }

    .login-right {
      width: 480px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 60px;
      background: var(--paper);
    }
    .login-right h2 { font-family: 'Inter Tight', sans-serif; font-size: 28px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 8px; }
    .login-right .sub { font-size: 14px; color: var(--muted); margin-bottom: 32px; }

    .login-tabs { display: flex; background: var(--paper-2); border-radius: 12px; padding: 4px; margin-bottom: 28px; }
    .login-tab { flex: 1; padding: 10px 16px; border: none; background: none; border-radius: 10px; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; transition: all 0.2s; }
    .login-tab.active { background: var(--paper); color: var(--ink); box-shadow: 0 2px 8px rgba(0,0,0,0.08); }

    .login-error { background: rgba(200,58,46,0.1); color: var(--red); padding: 12px 16px; border-radius: 12px; font-size: 13px; font-weight: 500; margin-bottom: 20px; display: none; border: 1px solid var(--red); }
    .login-success { background: rgba(44,138,85,0.1); color: var(--green-deep); padding: 12px 16px; border-radius: 12px; font-size: 13px; font-weight: 500; margin-bottom: 20px; display: none; border: 1px solid var(--green-deep); }

    .login-copy { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); text-align: center; margin-top: 32px; }

    @media (max-width: 900px) {
      body { flex-direction: column; }
      .login-left { min-height: 200px; padding: 30px; }
      .login-left::before { font-size: 200px; right: -40px; bottom: -40px; }
      .login-tagline h1 { font-size: 28px; }
      .login-right { width: 100%; padding: 40px 24px; }
    }
  </style>
</head>
<body>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="../assets/js/firebase-config.js"></script>

  <div class="login-left">
    <a href="../index.html" class="login-brand"><span>Lidara</span><span class="star">✦</span></a>
    <div class="login-tagline">
      <h1>Gestão escolar <span class="it">simplificada</span></h1>
      <p>Registre notas, acompanhe positivos e negativos, gere boletins — tudo sincronizado em tempo real.</p>
    </div>
    <div class="login-footer">Sistema de Gestão Escolar</div>
  </div>

  <div class="login-right">
    <h2>Bem-vindo</h2>
    <p class="sub">Entre na sua conta ou crie uma nova</p>

    <div class="login-tabs">
      <button class="login-tab active" onclick="switchTab('login')">Entrar</button>
      <button class="login-tab" onclick="switchTab('register')">Cadastrar</button>
    </div>

    <div id="errorMsg" class="login-error"></div>
    <div id="successMsg" class="login-success"></div>

    <!-- Login Form -->
    <div id="loginForm">
      <div class="field">
        <label>E-mail</label>
        <input type="email" id="loginEmail" placeholder="seu@email.com">
      </div>
      <div class="field">
        <label>Senha</label>
        <input type="password" id="loginPassword" placeholder="Sua senha">
      </div>
      <button class="btn btn-pri" style="width: 100%; justify-content: center; margin-top: 8px;" onclick="doLogin()" id="btnLogin">Entrar</button>
    </div>

    <!-- Register Form -->
    <div id="registerForm" style="display: none;">
      <div class="field">
        <label>Nome de Usuário</label>
        <input type="text" id="regUsername" placeholder="Professor Silva">
      </div>
      <div class="field">
        <label>E-mail</label>
        <input type="email" id="regEmail" placeholder="seu@email.com">
      </div>
      <div class="field">
        <label>Senha</label>
        <input type="password" id="regPassword" placeholder="Mínimo 6 caracteres">
      </div>
      <div class="field">
        <label>Confirmar Senha</label>
        <input type="password" id="regPasswordConfirm" placeholder="Repita a senha">
      </div>
      <button class="btn btn-pri" style="width: 100%; justify-content: center; margin-top: 8px;" onclick="doRegister()" id="btnRegister">Criar Conta</button>
    </div>

    <p class="login-copy">Lidara © 2026</p>
  </div>

  <script>
    firebase.auth().onAuthStateChanged(function(user) {
      if (user) {
        window.location.href = 'dashboard.html';
      }
    });

    // Check URL hash for tab
    if (window.location.hash === '#cadastro') {
      switchTab('register');
    }

    function switchTab(tab) {
      var tabs = document.querySelectorAll('.login-tab');
      tabs[0].className = 'login-tab' + (tab === 'login' ? ' active' : '');
      tabs[1].className = 'login-tab' + (tab === 'register' ? ' active' : '');
      document.getElementById('loginForm').style.display = tab === 'login' ? '' : 'none';
      document.getElementById('registerForm').style.display = tab === 'register' ? '' : 'none';
      hideMessages();
    }

    function showError(msg) {
      var el = document.getElementById('errorMsg');
      el.textContent = msg;
      el.style.display = '';
      document.getElementById('successMsg').style.display = 'none';
    }

    function showSuccess(msg) {
      var el = document.getElementById('successMsg');
      el.textContent = msg;
      el.style.display = '';
      document.getElementById('errorMsg').style.display = 'none';
    }

    function hideMessages() {
      document.getElementById('errorMsg').style.display = 'none';
      document.getElementById('successMsg').style.display = 'none';
    }

    function translateError(code) {
      var msgs = {
        'auth/email-already-in-use': 'Este e-mail já está cadastrado.',
        'auth/invalid-email': 'E-mail inválido.',
        'auth/weak-password': 'Senha muito fraca (mínimo 6 caracteres).',
        'auth/user-not-found': 'Usuário não encontrado.',
        'auth/wrong-password': 'Senha incorreta.',
        'auth/too-many-requests': 'Muitas tentativas. Tente novamente mais tarde.',
        'auth/invalid-credential': 'Credenciais inválidas. Verifique e-mail e senha.',
      };
      return msgs[code] || 'Erro: ' + code;
    }

    function doLogin() {
      var email = document.getElementById('loginEmail').value.trim();
      var password = document.getElementById('loginPassword').value;
      if (!email || !password) return showError('Preencha todos os campos.');
      hideMessages();

      var btn = document.getElementById('btnLogin');
      btn.disabled = true;
      btn.textContent = 'Entrando...';

      firebase.auth().signInWithEmailAndPassword(email, password)
        .then(function(result) {
          window.location.href = 'dashboard.html';
        })
        .catch(function(err) {
          showError(translateError(err.code));
          btn.disabled = false;
          btn.textContent = 'Entrar';
        });
    }

    function doRegister() {
      var username = document.getElementById('regUsername').value.trim();
      var email = document.getElementById('regEmail').value.trim();
      var password = document.getElementById('regPassword').value;
      var confirm = document.getElementById('regPasswordConfirm').value;

      if (!username || !email || !password || !confirm) return showError('Preencha todos os campos.');
      if (password !== confirm) return showError('As senhas não coincidem.');
      if (password.length < 6) return showError('Senha deve ter no mínimo 6 caracteres.');
      hideMessages();

      var btn = document.getElementById('btnRegister');
      btn.disabled = true;
      btn.textContent = 'Criando conta...';

      firebase.auth().createUserWithEmailAndPassword(email, password)
        .then(function(result) {
          return result.user.updateProfile({ displayName: username }).then(function() {
            return db.collection('users').doc(result.user.uid).set({
              username: username,
              email: email,
              createdAt: new Date().toISOString()
            });
          });
        })
        .then(function() {
          showSuccess('Conta criada com sucesso! Redirecionando...');
          setTimeout(function() {
            window.location.href = 'setup.html';
          }, 1000);
        })
        .catch(function(err) {
          showError(translateError(err.code));
          btn.disabled = false;
          btn.textContent = 'Criar Conta';
        });
    }

    document.getElementById('loginPassword').addEventListener('keydown', function(e) { if (e.key === 'Enter') doLogin(); });
    document.getElementById('loginEmail').addEventListener('keydown', function(e) { if (e.key === 'Enter') doLogin(); });
    document.getElementById('regPasswordConfirm').addEventListener('keydown', function(e) { if (e.key === 'Enter') doRegister(); });
  </script>
</body>
</html>
