<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Configurações — Lidara</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
  <style>
    .cfg-section { margin-bottom: 32px; }
    .cfg-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
    .cfg-field { display: flex; flex-direction: column; gap: 6px; }
    .cfg-field label { font-size: 0.75rem; font-weight: 700; color: var(--gray-500); text-transform: uppercase; letter-spacing: 0.04em; }
    .cfg-field input, .cfg-field select {
      padding: 11px 14px; border: 2px solid var(--gray-200); border-radius: 10px;
      font-size: 0.95rem; font-weight: 500; outline: none; transition: border-color 0.2s;
      font-family: inherit; background: #fff; color: var(--gray-900);
    }
    .cfg-field input:focus, .cfg-field select:focus { border-color: var(--green); }
    .cfg-hint { font-size: 0.72rem; color: var(--gray-400); }

    /* Tag list */
    .tag-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; min-height: 36px; }
    .tag {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--light); color: var(--dark);
      padding: 5px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600;
      border: 1px solid rgba(17,199,111,0.2);
    }
    .tag button {
      background: none; border: none; cursor: pointer;
      color: var(--gray-400); font-size: 0.9rem; line-height: 1;
      padding: 0; transition: color 0.15s;
    }
    .tag button:hover { color: var(--red); }
    .tag-green { background: var(--green); color: #fff; border-color: transparent; }
    .tag-green button { color: rgba(255,255,255,0.7); }
    .tag-green button:hover { color: #fff; }

    /* Add field row */
    .add-row { display: flex; gap: 8px; margin-top: 12px; }
    .add-row input, .add-row select {
      flex: 1; padding: 9px 12px; border: 2px solid var(--gray-200); border-radius: 9px;
      font-size: 0.875rem; outline: none; font-family: inherit; transition: border-color 0.2s;
    }
    .add-row input:focus, .add-row select:focus { border-color: var(--green); }

    /* Matérias table */
    .materias-list { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
    .materia-item {
      display: flex; align-items: center; gap: 12px;
      background: var(--gray-50); border-radius: 10px; padding: 12px 14px;
      border: 1px solid var(--gray-100);
    }
    .materia-item .nome { flex: 1; font-weight: 600; font-size: 0.9rem; color: var(--dark); }
    .materia-item .turmas-tags { display: flex; flex-wrap: wrap; gap: 5px; }
    .materia-item .turmas-tags span {
      background: var(--light); color: var(--dark);
      font-size: 0.7rem; font-weight: 700; padding: 2px 8px; border-radius: 10px;
    }
    .materia-item .actions { display: flex; gap: 6px; margin-left: auto; }

    /* Bimestres */
    .bim-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-top: 12px; }
    .bim-card {
      background: var(--gray-50); border-radius: 12px; padding: 16px;
      border: 1px solid var(--gray-100);
    }
    .bim-card h4 { font-size: 0.8rem; font-weight: 700; color: var(--dark); margin-bottom: 10px; }
    .bim-dates { display: flex; flex-direction: column; gap: 8px; }
    .bim-dates label { font-size: 0.7rem; color: var(--gray-500); font-weight: 600; }
    .bim-dates input[type="date"] {
      width: 100%; padding: 7px 10px; border: 1px solid var(--gray-200); border-radius: 7px;
      font-size: 0.8rem; font-family: inherit; outline: none; transition: border-color 0.2s;
    }
    .bim-dates input[type="date"]:focus { border-color: var(--green); }

    /* Danger zone */
    .danger-zone { border: 1.5px solid #FCA5A5; border-radius: var(--radius-lg); padding: 20px; }
    .danger-zone h4 { color: var(--red); font-size: 0.9rem; margin-bottom: 12px; }

    /* Modal overlay */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.45); z-index: 500;
      align-items: center; justify-content: center; padding: 20px;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
      background: #fff; border-radius: var(--radius-lg); max-width: 480px; width: 100%;
      box-shadow: var(--shadow-lg); overflow: hidden;
    }
    .modal-head {
      padding: 20px 24px; border-bottom: 1px solid var(--gray-100);
      display: flex; align-items: center; justify-content: space-between;
    }
    .modal-head h3 { font-size: 1rem; font-weight: 800; color: var(--dark); }
    .modal-head button { background: none; border: none; cursor: pointer; color: var(--gray-400); font-size: 1.2rem; }
    .modal-body { padding: 24px; }
    .modal-foot { padding: 16px 24px; border-top: 1px solid var(--gray-100); display: flex; gap: 8px; justify-content: flex-end; }

    .checkbox-list { display: flex; flex-direction: column; gap: 8px; max-height: 280px; overflow-y: auto; }
    .checkbox-list label {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; background: var(--gray-50); border-radius: 8px;
      cursor: pointer; font-size: 0.875rem; font-weight: 600; color: var(--dark);
    }
    .checkbox-list input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; accent-color: var(--green); }

    /* Notas config */
    .turmas-selector { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 12px; }
    .turmas-selector .cfg-field { margin: 0; }

    /* Mobile responsiveness */
    @media (max-width: 768px) {
      .cfg-row { grid-template-columns: 1fr !important; }
      .turmas-selector { grid-template-columns: 1fr !important; }
      .sidebar-nav { gap: 2px; }
      .sidebar-nav a { padding: 6px 10px; font-size: 0.75rem; }
      .sidebar-nav a svg { width: 16px; height: 16px; }
      .sidebar-logo .text h1 { font-size: 0.85rem; }
      .topbar { padding: 8px 16px; }
      .topbar-controls { flex-wrap: wrap; }
      .topbar-select { flex: 1 1 auto; min-width: 120px; }
    }

    @media (max-width: 480px) {
      .sidebar { padding: 0 12px; }
      .sidebar-nav a { padding: 4px 6px; }
      .sidebar-nav a svg { display: none; }
      .topbar-title { font-size: 0.9rem; }
      .topbar-select { font-size: 0.7rem; }
    }
  </style>
</head>
<body>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="../assets/js/firebase-config.js"></script>
  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/auth-guard.js"></script>

  <div id="app" style="visibility:hidden;"></div>

  <!-- Add Matéria Modal -->
  <div id="modalMateria" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-head">
        <h3 id="modalMateriaTitle">Nova Matéria</h3>
        <button onclick="closeModalMateria()">&times;</button>
      </div>
      <div class="modal-body">
        <div class="cfg-field" style="margin-bottom:16px;">
          <label>Nome da Matéria</label>
          <select id="modalMateriaNome" style="padding:11px 14px;border:2px solid var(--gray-200);border-radius:10px;font-size:0.95rem;outline:none;font-family:inherit;">
            <option value="">— Selecione ou digite —</option>
          </select>
        </div>
        <div class="cfg-field">
          <label>Vincular a quais anos</label>
          <div class="checkbox-list" id="modalMateriaAnos"></div>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-outline" onclick="closeModalMateria()">Cancelar</button>
        <button class="btn btn-primary" onclick="saveMateria()">Salvar</button>
      </div>
    </div>
  </div>

  <script>
    // ============================
    // DATA HELPERS
    // ============================
    function getProf() {
      return Store.getProfessor() || { anos: [], turmas: [], materias: [] };
    }

    function saveProf(prof) {
      Store.setProfessor(prof);
    }

    // Sync with Store
    var TODAS_MATERIAS = Store.TODAS_MATERIAS;
    var SEGMENTS = Store.SEGMENTS;
    var CLASSES = Store.CLASSES;
    var ANOS_DISPONIVEIS = Store.ANOS_DISPONIVEIS;
    var TURMAS_DISPONIVEIS = Store.TURMAS_DISPONIVEIS;

    var BIM_DATAS_KEY = 'lidara_bim_datas';

    function getBimDatas() {
      try { return JSON.parse(localStorage.getItem(BIM_DATAS_KEY)) || {}; }
      catch(e) { return {}; }
    }

    function setBimDatas(d) {
      localStorage.setItem(BIM_DATAS_KEY, JSON.stringify(d));
    }

    // ============================
    // RENDER
    // ============================
    document.getElementById('app').innerHTML =
      Components.sidebar('configuracoes') +
      '<div class="main-content">' +
        Components.topbar('Configurações', false) +
        '<div class="page-container">' +

          // ── ESCOLA ──────────────────────────────
          '<div class="card cfg-section">' +
            '<div class="card-header"><h3>Escola</h3></div>' +
            '<div class="cfg-row">' +
              '<div class="cfg-field">' +
                '<label>Nome da Escola</label>' +
                '<input type="text" id="inputEscola" placeholder="Ex: Colégio São Paulo" />' +
                '<span class="cfg-hint">Aparece no cabeçalho dos relatórios</span>' +
              '</div>' +
            '</div>' +
            '<div style="margin-top:16px;display:flex;gap:8px;">' +
              '<button class="btn btn-primary" onclick="saveEscola()">Salvar Escola</button>' +
            '</div>' +
          '</div>' +

          // ── ANOS LETIVOS ────────────────────────
          '<div class="card cfg-section">' +
            '<div class="card-header"><h3>Anos Letivos</h3>' +
              '<span style="font-size:0.75rem;color:var(--gray-400);">Gerenciar múltiplos anos</span>' +
            '</div>' +
            '<div style="margin-bottom:20px;">' +
              '<p style="font-size:0.8rem;font-weight:700;color:var(--gray-500);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:12px;">Criar Novo Ano Letivo</p>' +
              '<div style="display:flex;gap:8px;">' +
                '<input type="number" id="inputNovoAnoLetivo" min="2020" max="2050" placeholder="Ano (ex: 2026)" />' +
                '<button class="btn btn-primary" onclick="createNewYear()">+ Criar</button>' +
              '</div>' +
            '</div>' +
            '<div style="padding:14px;background:var(--light);border-radius:10px;">' +
              '<p style="font-size:0.8rem;font-weight:700;color:var(--dark);margin-bottom:10px;">Anos Disponíveis:</p>' +
              '<div id="yearsListDisplay" style="display:flex;flex-wrap:wrap;gap:8px;"></div>' +
            '</div>' +
          '</div>' +

          // ── FÓRMULA DE NOTAS ─────────────────────
          '<div class="card cfg-section">' +
            '<div class="card-header"><h3>Fórmula de Notas</h3>' +
              '<span style="font-size:0.75rem;color:var(--gray-400);">Customize os pesos de cálculo</span>' +
            '</div>' +
            '<div style="margin-bottom:16px;">' +
              '<label style="display:flex;align-items:center;gap:10px;cursor:pointer;margin-bottom:12px;">' +
                '<input type="checkbox" id="chkUsarPB" onchange="onUsarPBChange()" style="width:18px;height:18px;" />' +
                '<span style="font-weight:600;color:var(--dark);">Usar Prova Bimestral</span>' +
              '</label>' +
              '<div id="pesosComPB" style="display:none;margin-top:12px;padding:14px;background:var(--gray-50);border-radius:10px;">' +
                '<p style="font-size:0.75rem;font-weight:700;color:var(--gray-500);margin-bottom:12px;">Defina os pesos (devem somar 100%)</p>' +
                '<div class="cfg-row" style="grid-template-columns:repeat(3,1fr);gap:12px;">' +
                  '<div class="cfg-field">' +
                    '<label>PB (%)</label>' +
                    '<input type="number" id="pesoPB" min="0" max="100" value="35" />' +
                  '</div>' +
                  '<div class="cfg-field">' +
                    '<label>Quali (%)</label>' +
                    '<input type="number" id="pesoQuali" min="0" max="100" value="30" />' +
                  '</div>' +
                  '<div class="cfg-field">' +
                    '<label>VA (%)</label>' +
                    '<input type="number" id="pesoVA" min="0" max="100" value="35" />' +
                  '</div>' +
                '</div>' +
                '<p id="validacaoPesos" style="font-size:0.75rem;color:var(--green);margin-top:8px;">✓ Soma = 100%</p>' +
              '</div>' +
              '<div id="pesosSemPB" style="display:none;margin-top:12px;padding:14px;background:var(--gray-50);border-radius:10px;">' +
                '<p style="font-size:0.75rem;font-weight:700;color:var(--gray-500);margin-bottom:12px;">Sem Prova Bimestral (defina os pesos)</p>' +
                '<div class="cfg-row" style="grid-template-columns:repeat(2,1fr);gap:12px;">' +
                  '<div class="cfg-field">' +
                    '<label>Quali (%)</label>' +
                    '<input type="number" id="pesoQualiSemPB" min="0" max="100" value="30" />' +
                  '</div>' +
                  '<div class="cfg-field">' +
                    '<label>VA (%)</label>' +
                    '<input type="number" id="pesoVASemPB" min="0" max="100" value="70" />' +
                  '</div>' +
                '</div>' +
                '<p id="validacaoPesosSemPB" style="font-size:0.75rem;color:var(--green);margin-top:8px;">✓ Soma = 100%</p>' +
              '</div>' +
            '</div>' +
            '<div class="cfg-field" style="margin-bottom:16px;">' +
              '<label>Nota Mínima para Aprovação</label>' +
              '<input type="number" id="notaMinimaAprovacao" min="0" max="10" step="0.1" value="6.0" />' +
            '</div>' +
            '<button class="btn btn-primary" onclick="saveGradesConfig()">Salvar Configuração de Notas</button>' +
          '</div>' +

          // ── TURMAS ──────────────────────────────
          '<div class="card cfg-section">' +
            '<div class="card-header"><h3>Turmas Configuradas</h3>' +
              '<span style="font-size:0.75rem;color:var(--gray-400);">Selecione segmento, série e turma</span>' +
            '</div>' +

            '<div style="margin-bottom:20px;">' +
              '<p style="font-size:0.8rem;font-weight:700;color:var(--gray-500);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:12px;">Adicionar Turma</p>' +
              '<div class="cfg-row" style="grid-template-columns: 2fr 2fr 1fr 1fr; gap: 12px;">' +
                '<div class="cfg-field">' +
                  '<label>Segmento</label>' +
                  '<select id="selectSegmento" onchange="onSegmentoChange()">' +
                    '<option value="">— Selecione —</option>' +
                    '<option value="FI">Fundamental I (2º-5º)</option>' +
                    '<option value="FII">Fundamental II (6º-9º)</option>' +
                    '<option value="EM">Ensino Médio (1º-3º)</option>' +
                  '</select>' +
                '</div>' +
                '<div class="cfg-field">' +
                  '<label>Série</label>' +
                  '<select id="selectSerie">' +
                    '<option value="">— Selecione segmento —</option>' +
                  '</select>' +
                '</div>' +
                '<div class="cfg-field">' +
                  '<label>Turma</label>' +
                  '<select id="selectClasse">' +
                    CLASSES.map(function(c){ return '<option value="'+c+'">'+c+'</option>'; }).join('') +
                  '</select>' +
                '</div>' +
                '<button class="btn btn-outline" onclick="addTurmaNew()" style="align-self:flex-end;">+ Adicionar</button>' +
              '</div>' +
            '</div>' +

            '<div style="margin-top:20px;padding:14px;background:var(--light);border-radius:10px;">' +
              '<p style="font-size:0.8rem;font-weight:700;color:var(--dark);margin-bottom:8px;">Turmas Ativas:</p>' +
              '<div id="turmasListaAtivas" style="display:flex;flex-wrap:wrap;gap:6px;"></div>' +
            '</div>' +
          '</div>' +

          // ── MATÉRIAS ─────────────────────────────
          '<div class="card cfg-section">' +
            '<div class="card-header"><h3>Matérias</h3>' +
              '<button class="btn btn-outline" onclick="openModalMateria()" style="font-size:0.75rem;padding:6px 14px;">+ Adicionar</button>' +
            '</div>' +
            '<div id="materiasList" class="materias-list"></div>' +
          '</div>' +

          // ── PERÍODO LETIVO ───────────────────────
          '<div class="card cfg-section">' +
            '<div class="card-header"><h3>Período Letivo</h3>' +
              '<span style="font-size:0.75rem;color:var(--gray-400);">Datas por bimestre</span>' +
            '</div>' +
            '<div class="bim-grid" id="bimGrid"></div>' +
            '<div style="margin-top:16px;">' +
              '<button class="btn btn-primary" onclick="saveBimDatas()">Salvar Datas</button>' +
            '</div>' +
          '</div>' +

          // ── AÇÕES ────────────────────────────────
          '<div class="card cfg-section">' +
            '<div class="card-header"><h3>Ações</h3></div>' +
            '<div style="display:flex;gap:10px;flex-wrap:wrap;">' +
              '<a href="perfil.html" class="btn btn-outline" style="text-decoration:none;">Meu Perfil</a>' +
              '<button class="btn btn-outline" onclick="exportAllData()">Exportar Dados</button>' +
            '</div>' +
            '<div class="danger-zone" style="margin-top:20px;">' +
              '<h4>Zona de Perigo</h4>' +
              '<p style="font-size:0.8rem;color:var(--gray-500);margin-bottom:12px;">Estas ações são irreversíveis.</p>' +
              '<button class="btn" style="background:#FEE2E2;color:var(--red);border:1px solid #FCA5A5;" onclick="clearAllData()">Apagar Todos os Dados</button>' +
            '</div>' +
          '</div>' +

        '</div>' +
        Components.footer() +
      '</div>';

    // ============================
    // INIT
    // ============================
    (function init() {
      // Escola / ano letivo
      var profile = Store.getProfile();
      var config = Store.getConfig();
      document.getElementById('inputEscola').value = profile.escola || '';

      renderYearsList();
      renderAnosTags();
      renderTurmasTags();
      renderTurmasGeradas();
      renderTurmasAtivas();
      renderMaterias();
      renderBimGrid();
      renderGradesConfig();

      // Adicionar listeners para validação em tempo real
      ['pesoPB', 'pesoQuali', 'pesoVA'].forEach(function(id) {
        var el = document.getElementById(id);
        if (el) el.addEventListener('change', updatePesosValidation);
      });
      ['pesoQualiSemPB', 'pesoVASemPB'].forEach(function(id) {
        var el = document.getElementById(id);
        if (el) el.addEventListener('change', updatePesosValidation);
      });

      Store.loadFromCloud(function(success) {
        if (success) {
          var p = Store.getProfile();
          document.getElementById('inputEscola').value = p.escola || '';
          renderYearsList();
          renderAnosTags();
          renderTurmasTags();
          renderTurmasGeradas();
          renderTurmasAtivas();
          renderMaterias();
          renderGradesConfig();
        }
      });
    })();

    // ============================
    // ESCOLA
    // ============================
    function saveEscola() {
      var profile = Store.getProfile();
      profile.escola = document.getElementById('inputEscola').value.trim();
      Store.setProfile(profile);
      showToast('Escola salva!');
    }

    // ============================
    // ANOS LETIVOS
    // ============================
    function renderYearsList() {
      var yearsConfig = Store.getYearsConfig();
      var activeYear = Store.getActiveYear();
      var years = yearsConfig.years || [];
      var html = '';
      years.sort(function(a, b) { return b - a; });
      years.forEach(function(y) {
        var active = y === activeYear;
        var badge = active ? '<span style="background:var(--green);color:#fff;font-size:0.65rem;padding:2px 8px;border-radius:4px;font-weight:700;margin-left:4px;">Ativo</span>' : '';
        html += '<span class="tag' + (active ? ' tag-green' : '') + '">' +
          y + ' ' + (active ? '(Ativo)' : '') +
          '<button onclick="switchYear(' + y + ')">Usar</button>' +
          (years.length > 1 ? '<button onclick="deleteYear(' + y + ')">×</button>' : '') +
        '</span>';
      });
      var el = document.getElementById('yearsListDisplay');
      if (el) el.innerHTML = html || '<span style="font-size:0.8rem;color:var(--gray-400);">Nenhum ano criado</span>';
    }

    function createNewYear() {
      var ano = parseInt(document.getElementById('inputNovoAnoLetivo').value);
      if (ano < 2020 || ano > 2050) { alert('Ano inválido (2020–2050).'); return; }
      var yearsConfig = Store.getYearsConfig();
      if (yearsConfig.years.indexOf(ano) !== -1) { alert('Este ano já existe.'); return; }
      if (Store.createNewYear(ano)) {
        showToast('Ano letivo ' + ano + ' criado!');
        document.getElementById('inputNovoAnoLetivo').value = '';
        renderYearsList();
      } else {
        alert('Erro ao criar novo ano.');
      }
    }

    function switchYear(year) {
      Store.setActiveYear(year);
      showToast('Ano letivo alterado para ' + year + '. Recarregando...');
      setTimeout(function() { location.reload(); }, 800);
    }

    function deleteYear(year) {
      if (!confirm('Tem certeza que deseja deletar o ano ' + year + '? Esta ação não pode ser desfeita.')) return;
      if (Store.deleteYear(year)) {
        showToast('Ano deletado!');
        renderYearsList();
        renderGradesConfig();
      } else {
        alert('Erro ao deletar ano.');
      }
    }

    // ============================
    // ANOS
    // ============================
    function renderAnosTags() {
      var prof = getProf();
      var anos = prof.anos || [];
      var html = '';
      anos.forEach(function(a) {
        html += '<span class="tag tag-green">' + a + 'º Ano' +
          '<button onclick="removeAno(\'' + a + '\')">×</button></span>';
      });
      document.getElementById('tagAnosList').innerHTML = html || '<span style="font-size:0.8rem;color:var(--gray-400);">Nenhum ano adicionado</span>';
    }

    function addAno() {
      var val = document.getElementById('selectAddAno').value;
      var prof = getProf();
      if (!prof.anos) prof.anos = [];
      if (prof.anos.indexOf(val) === -1) {
        prof.anos.push(val);
        prof.anos.sort();
        saveProf(prof);
        renderAnosTags();
        renderTurmasGeradas();
      }
    }

    function removeAno(ano) {
      var prof = getProf();
      prof.anos = (prof.anos || []).filter(function(a) { return a !== ano; });
      saveProf(prof);
      renderAnosTags();
      renderTurmasGeradas();
    }

    // ============================
    // TURMAS (letras)
    // ============================
    function renderTurmasTags() {
      var prof = getProf();
      var turmas = prof.turmas || [];
      var html = '';
      turmas.forEach(function(t) {
        html += '<span class="tag tag-green">Turma ' + t +
          '<button onclick="removeTurma(\'' + t + '\')">×</button></span>';
      });
      document.getElementById('tagTurmasList').innerHTML = html || '<span style="font-size:0.8rem;color:var(--gray-400);">Nenhuma turma adicionada</span>';
    }

    function addTurma() {
      var val = document.getElementById('selectAddTurma').value;
      var prof = getProf();
      if (!prof.turmas) prof.turmas = [];
      if (prof.turmas.indexOf(val) === -1) {
        prof.turmas.push(val);
        prof.turmas.sort();
        saveProf(prof);
        renderTurmasTags();
        renderTurmasGeradas();
      }
    }

    function removeTurma(letra) {
      var prof = getProf();
      prof.turmas = (prof.turmas || []).filter(function(t) { return t !== letra; });
      saveProf(prof);
      renderTurmasTags();
      renderTurmasGeradas();
    }

    function renderTurmasGeradas() {
      var prof = getProf();
      var anos = prof.anos || [];
      var turmas = prof.turmas || [];
      var geradas = [];
      anos.forEach(function(ano) {
        turmas.forEach(function(letra) { geradas.push(ano + letra); });
      });
      geradas.sort();
      var el = document.getElementById('turmasGeradasList');
      if (geradas.length === 0) {
        el.innerHTML = '<span style="font-size:0.8rem;color:var(--gray-400);">Nenhuma turma gerada ainda</span>';
      } else {
        el.innerHTML = geradas.map(function(t) {
          return '<span style="background:#fff;border:1px solid var(--gray-200);border-radius:8px;padding:4px 10px;font-size:0.8rem;font-weight:700;color:var(--dark);">' + Store.formatTurma(t) + '</span>';
        }).join('');
      }
    }

    // New turmas system (Segmento + Série + Turma)
    function onSegmentoChange() {
      var seg = document.getElementById('selectSegmento').value;
      var selSerie = document.getElementById('selectSerie');
      if (!seg) {
        selSerie.innerHTML = '<option value="">— Selecione segmento —</option>';
        return;
      }
      var segData = SEGMENTS[seg];
      var anos = segData && segData.anos ? segData.anos : [];
      selSerie.innerHTML = anos.map(function(a) {
        var label = a.length > 1 ? a + 'º' : a + 'º';
        return '<option value="' + a + '">' + label + ' Ano</option>';
      }).join('');
    }

    function addTurmaNew() {
      var seg = document.getElementById('selectSegmento').value;
      var serie = document.getElementById('selectSerie').value;
      var classe = document.getElementById('selectClasse').value;
      if (!seg || !serie || !classe) { alert('Selecione segmento, série e turma.'); return; }

      var codigo = Store.parseTurma(seg, serie, classe);
      if (!codigo) { alert('Erro ao gerar código da turma.'); return; }

      var prof = getProf();
      if (!prof.turmas) prof.turmas = [];
      if (!prof.anos) prof.anos = [];

      // Add to anos if not present
      if (prof.anos.indexOf(serie) === -1) {
        prof.anos.push(serie);
        prof.anos.sort();
      }

      saveProf(prof);
      renderTurmasAtivas();
      renderTurmasGeradas();
      document.getElementById('selectSegmento').value = '';
      document.getElementById('selectSerie').value = '';
      showToast('Turma adicionada!');
    }

    function renderTurmasAtivas() {
      var prof = getProf();
      var turmas = prof.turmas || [];
      var turmasAtivas = [];

      // Generate all possible turmas from current config
      prof.anos?.forEach(function(ano) {
        turmas.forEach(function(letra) {
          turmasAtivas.push(ano + letra);
        });
      });

      var el = document.getElementById('turmasListaAtivas');
      if (turmasAtivas.length === 0) {
        el.innerHTML = '<span style="font-size:0.8rem;color:var(--gray-400);">Nenhuma turma configurada</span>';
      } else {
        el.innerHTML = turmasAtivas.sort().map(function(t) {
          return '<span style="background:#fff;border:1px solid var(--gray-200);border-radius:8px;padding:6px 12px;font-size:0.8rem;font-weight:700;color:var(--dark);">' + Store.formatTurma(t) + '</span>';
        }).join('');
      }
    }

    // ============================
    // MATÉRIAS
    // ============================
    var editMateriaIdx = -1;

    function renderMaterias() {
      var prof = getProf();
      var materias = prof.materias || [];
      var el = document.getElementById('materiasList');
      if (materias.length === 0) {
        el.innerHTML = '<p style="color:var(--gray-400);font-size:0.875rem;padding:8px 0;">Nenhuma matéria configurada.</p>';
        return;
      }
      el.innerHTML = materias.map(function(m, idx) {
        var anosHtml = (m.anos || []).map(function(a) {
          return '<span>' + a + 'º</span>';
        }).join('');
        return '<div class="materia-item">' +
          '<span class="nome">' + m.nome + '</span>' +
          '<div class="turmas-tags">' + anosHtml + '</div>' +
          '<div class="actions">' +
            '<button class="btn-icon-sm" style="background:var(--light);color:var(--dark);" onclick="openEditMateria(' + idx + ')" title="Editar">' +
              '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="width:13px;height:13px;"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>' +
            '</button>' +
            '<button class="btn-icon-sm" style="background:#FEE2E2;color:var(--red);" onclick="removeMateria(' + idx + ')" title="Remover">' +
              '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="width:13px;height:13px;"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>' +
            '</button>' +
          '</div>' +
        '</div>';
      }).join('');
    }

    function openModalMateria() {
      editMateriaIdx = -1;
      document.getElementById('modalMateriaTitle').textContent = 'Nova Matéria';
      buildMateriaModal(null);
      document.getElementById('modalMateria').classList.add('open');
    }

    function openEditMateria(idx) {
      editMateriaIdx = idx;
      var prof = getProf();
      var m = prof.materias[idx];
      document.getElementById('modalMateriaTitle').textContent = 'Editar Matéria';
      buildMateriaModal(m);
      document.getElementById('modalMateria').classList.add('open');
    }

    function buildMateriaModal(materia) {
      var prof = getProf();
      var anos = prof.anos || ANOS_DISPONIVEIS;
      var nomeSel = document.getElementById('modalMateriaNome');
      nomeSel.innerHTML = '<option value="">— Selecione —</option>' +
        TODAS_MATERIAS.map(function(m) {
          var sel = materia && materia.nome === m ? ' selected' : '';
          return '<option value="' + m + '"' + sel + '>' + m + '</option>';
        }).join('');
      // Also allow custom text
      if (materia && TODAS_MATERIAS.indexOf(materia.nome) === -1) {
        nomeSel.innerHTML += '<option value="' + materia.nome + '" selected>' + materia.nome + '</option>';
      }

      var selectedAnos = materia ? (materia.anos || []) : [];
      document.getElementById('modalMateriaAnos').innerHTML = anos.map(function(a) {
        var chk = selectedAnos.indexOf(a) !== -1 ? ' checked' : '';
        return '<label><input type="checkbox" value="' + a + '"' + chk + ' /> ' + a + 'º Ano</label>';
      }).join('');
    }

    function closeModalMateria() {
      document.getElementById('modalMateria').classList.remove('open');
      editMateriaIdx = -1;
    }

    function saveMateria() {
      var nome = document.getElementById('modalMateriaNome').value.trim();
      if (!nome) { alert('Selecione uma matéria.'); return; }
      var anos = Array.from(document.querySelectorAll('#modalMateriaAnos input:checked')).map(function(cb) { return cb.value; });
      if (anos.length === 0) { alert('Selecione pelo menos um ano.'); return; }
      var prof = getProf();
      if (!prof.materias) prof.materias = [];
      if (editMateriaIdx >= 0) {
        prof.materias[editMateriaIdx] = { nome: nome, anos: anos };
      } else {
        prof.materias.push({ nome: nome, anos: anos });
      }
      saveProf(prof);
      renderMaterias();
      closeModalMateria();
      showToast('Matéria salva!');
    }

    function removeMateria(idx) {
      if (!confirm('Remover esta matéria?')) return;
      var prof = getProf();
      prof.materias.splice(idx, 1);
      saveProf(prof);
      renderMaterias();
    }

    // ============================
    // BIMESTRES / PERÍODO LETIVO
    // ============================
    function renderBimGrid() {
      var datas = getBimDatas();
      var html = '';
      ['1','2','3','4'].forEach(function(b) {
        var d = datas[b] || { inicio: '', fim: '' };
        html += '<div class="bim-card">' +
          '<h4>' + b + 'º Bimestre</h4>' +
          '<div class="bim-dates">' +
            '<label>Início</label>' +
            '<input type="date" id="bim-' + b + '-inicio" value="' + d.inicio + '" />' +
            '<label>Término</label>' +
            '<input type="date" id="bim-' + b + '-fim" value="' + d.fim + '" />' +
          '</div>' +
        '</div>';
      });
      document.getElementById('bimGrid').innerHTML = html;
    }

    function saveBimDatas() {
      var datas = {};
      ['1','2','3','4'].forEach(function(b) {
        datas[b] = {
          inicio: document.getElementById('bim-' + b + '-inicio').value,
          fim: document.getElementById('bim-' + b + '-fim').value
        };
      });
      setBimDatas(datas);
      showToast('Datas salvas!');
    }

    // ============================
    // GRADES CONFIG
    // ============================
    function renderGradesConfig() {
      var cfg = Store.getGradesConfig();
      document.getElementById('chkUsarPB').checked = cfg.usarPB;
      document.getElementById('pesoPB').value = cfg.pesosPB.pb;
      document.getElementById('pesoQuali').value = cfg.pesosPB.quali;
      document.getElementById('pesoVA').value = cfg.pesosPB.va;
      document.getElementById('pesoQualiSemPB').value = cfg.pesosLEM.quali;
      document.getElementById('pesoVASemPB').value = cfg.pesosLEM.va;
      document.getElementById('notaMinimaAprovacao').value = cfg.notaMinimaAprovacao;
      onUsarPBChange();
      updatePesosValidation();
    }

    function onUsarPBChange() {
      var usar = document.getElementById('chkUsarPB').checked;
      document.getElementById('pesosComPB').style.display = usar ? 'block' : 'none';
      document.getElementById('pesosSemPB').style.display = usar ? 'none' : 'block';
      updatePesosValidation();
    }

    function updatePesosValidation() {
      var usar = document.getElementById('chkUsarPB').checked;
      if (usar) {
        var pb = parseInt(document.getElementById('pesoPB').value) || 0;
        var quali = parseInt(document.getElementById('pesoQuali').value) || 0;
        var va = parseInt(document.getElementById('pesoVA').value) || 0;
        var soma = pb + quali + va;
        var el = document.getElementById('validacaoPesos');
        if (soma === 100) {
          el.style.color = 'var(--green)';
          el.innerHTML = '✓ Soma = 100%';
        } else {
          el.style.color = 'var(--red)';
          el.innerHTML = '✗ Soma = ' + soma + '% (deve ser 100%)';
        }
      } else {
        var quali = parseInt(document.getElementById('pesoQualiSemPB').value) || 0;
        var va = parseInt(document.getElementById('pesoVASemPB').value) || 0;
        var soma = quali + va;
        var el = document.getElementById('validacaoPesosSemPB');
        if (soma === 100) {
          el.style.color = 'var(--green)';
          el.innerHTML = '✓ Soma = 100%';
        } else {
          el.style.color = 'var(--red)';
          el.innerHTML = '✗ Soma = ' + soma + '% (deve ser 100%)';
        }
      }
    }

    function saveGradesConfig() {
      var usar = document.getElementById('chkUsarPB').checked;
      var cfg = {
        usarPB: usar,
        pesosPB: {
          pb: parseInt(document.getElementById('pesoPB').value) || 35,
          quali: parseInt(document.getElementById('pesoQuali').value) || 30,
          va: parseInt(document.getElementById('pesoVA').value) || 35
        },
        pesosLEM: {
          quali: parseInt(document.getElementById('pesoQualiSemPB').value) || 30,
          va: parseInt(document.getElementById('pesoVASemPB').value) || 70
        },
        usarAnglo: true,
        notaMinimaAprovacao: parseFloat(document.getElementById('notaMinimaAprovacao').value) || 6.0
      };

      // Validar somas
      var somaComPB = cfg.pesosPB.pb + cfg.pesosPB.quali + cfg.pesosPB.va;
      var somaSemPB = cfg.pesosLEM.quali + cfg.pesosLEM.va;

      if (usar && somaComPB !== 100) { alert('Com PB: pesos devem somar 100% (atualmente ' + somaComPB + '%)'); return; }
      if (!usar && somaSemPB !== 100) { alert('Sem PB: pesos devem somar 100% (atualmente ' + somaSemPB + '%)'); return; }

      Store.setGradesConfig(cfg, Store.getActiveYear());
      showToast('Configuração de notas salva!');
    }

    // ============================
    // AÇÕES
    // ============================
    function exportAllData() {
      var data = Store.exportData();
      data.config = Store.getConfig();
      data.profile = Store.getProfile();
      data.bimDatas = getBimDatas();
      var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'lidara-backup-' + new Date().toISOString().split('T')[0] + '.json';
      a.click();
      URL.revokeObjectURL(url);
    }

    function clearAllData() {
      if (!confirm('ATENÇÃO: Isso irá apagar TODOS os dados (alunos, notas, configurações)!')) return;
      if (!confirm('Tem certeza absoluta? Esta ação não pode ser desfeita!')) return;
      Store.clearAll();
      localStorage.removeItem('picpay_dei_config');
      localStorage.removeItem('picpay_dei_profile');
      localStorage.removeItem('picpay_dei_professor');
      localStorage.removeItem(BIM_DATAS_KEY);
      alert('Todos os dados foram apagados. Recarregando...');
      location.reload();
    }

    // ============================
    // TOAST
    // ============================
    function showToast(msg) {
      var t = document.createElement('div');
      t.textContent = msg;
      t.style.cssText = 'position:fixed;bottom:24px;right:24px;background:var(--dark);color:#fff;padding:12px 20px;border-radius:10px;font-size:0.875rem;font-weight:600;z-index:9999;box-shadow:0 4px 16px rgba(0,0,0,0.15);transition:opacity 0.3s;';
      document.body.appendChild(t);
      setTimeout(function() { t.style.opacity = '0'; setTimeout(function() { t.remove(); }, 300); }, 2200);
    }
  </script>
</body>
</html>
