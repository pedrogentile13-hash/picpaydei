<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Configurações — picpay.de.i</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
  <style>
    .manual-section { margin-bottom:24px; }
    .manual-card { background:#fff; border-radius:1.25rem; border:1px solid var(--gray-100); overflow:hidden; margin-bottom:12px; }
    .manual-card-head { display:flex; align-items:center; justify-content:space-between; padding:16px 20px; cursor:pointer; transition:background 0.15s; }
    .manual-card-head:hover { background:var(--gray-50); }
    .manual-card-head h3 { font-size:0.95rem; font-weight:700; color:var(--dark); display:flex; align-items:center; gap:12px; margin:0; }
    .manual-card-head .step-num { width:32px; height:32px; border-radius:50%; background:var(--green); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:0.85rem; }
    .manual-card-head .arrow { font-size:0.8rem; color:var(--gray-400); transition:transform 0.2s; }
    .manual-card-head.open .arrow { transform:rotate(180deg); }
    .manual-card-body { display:none; padding:0 20px 20px 64px; }
    .manual-card-body.open { display:block; }
    .manual-card-body p { color:var(--gray-600); font-size:0.85rem; line-height:1.7; margin-bottom:12px; }
    .manual-card-body ul { margin:0 0 12px 20px; color:var(--gray-600); font-size:0.85rem; }
    .manual-card-body ul li { margin-bottom:6px; }
    .manual-card-body .tip { background:#FEF3C7; border-left:4px solid #F59E0B; padding:12px 16px; border-radius:0 8px 8px 0; margin:12px 0; }
    .manual-card-body .tip strong { color:#92400E; }
    .manual-card-body .tip p { color:#92400E; margin:0; }
    .manual-card-body .example { background:var(--gray-50); border-radius:8px; padding:12px 16px; font-family:monospace; font-size:0.8rem; color:var(--dark); margin:12px 0; }
    .manual-card-body img { max-width:100%; border-radius:8px; margin:12px 0; border:1px solid var(--gray-200); }
    .category-title { font-size:0.75rem; font-weight:700; color:var(--gray-500); text-transform:uppercase; letter-spacing:0.05em; margin:32px 0 16px; padding-bottom:8px; border-bottom:2px solid var(--gray-100); }
    .formula-box { background:linear-gradient(135deg, #11C76F 0%, #0EA85E 100%); color:#fff; padding:20px; border-radius:12px; margin:16px 0; }
    .formula-box h4 { font-size:0.85rem; font-weight:700; margin-bottom:8px; opacity:0.9; }
    .formula-box .formula { font-family:monospace; font-size:1.1rem; font-weight:700; }
    .shortcut-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; margin:16px 0; }
    .shortcut-item { background:var(--gray-50); padding:12px 16px; border-radius:8px; display:flex; align-items:center; gap:12px; }
    .shortcut-item kbd { background:var(--dark); color:#fff; padding:4px 8px; border-radius:4px; font-size:0.75rem; font-weight:700; }
    .shortcut-item span { font-size:0.85rem; color:var(--gray-600); }
    .expand-all-btn { padding:8px 16px; border-radius:8px; border:1px solid var(--gray-200); background:#fff; font-size:0.8rem; font-weight:600; color:var(--gray-600); cursor:pointer; transition:all 0.15s; }
    .expand-all-btn:hover { border-color:var(--green); color:var(--green); }
  </style>
</head>
<body>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="../assets/js/firebase-config.js"></script>
  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/auth-guard.js"></script>

  <div id="app" style="visibility:hidden;"></div>

  <script>
    var config = Store.getConfig();
    var notaCfg = Store.getNotaConfig();

    // ─── Build Turmas section HTML ────────────────────────
    function buildTurmasSection() {
      var segs = Store.SEGMENTOS;
      var segOpts = Object.keys(segs).map(function(k) {
        return '<option value="' + k + '">' + segs[k].label + '</option>';
      }).join('');

      var prof = Store.getProfessor();
      var turmasAtivas = (prof.turmasConfig || []).slice();
      var turmasHTML = turmasAtivas.length > 0
        ? turmasAtivas.map(function(t) {
            return '<span style="display:inline-flex;align-items:center;gap:4px;background:var(--bg-page);border:1px solid var(--border);border-radius:20px;padding:4px 12px;font-size:0.8rem;font-weight:600;">' +
              Store.formatTurma(t) +
              '<button onclick="removeTurma(\'' + t + '\')" style="background:none;border:none;cursor:pointer;color:var(--gray-400);font-size:0.9rem;line-height:1;padding:0 0 0 4px;">×</button>' +
            '</span>';
          }).join('')
        : '<span style="font-size:0.82rem;color:var(--gray-400);font-style:italic;">Nenhuma turma adicionada. Usando padrão do sistema.</span>';

      return '<div class="card" style="margin-bottom:24px;">' +
        '<div class="card-header"><h3>Turmas</h3></div>' +
        '<div class="card-body">' +
          '<div class="form-row" style="margin-bottom:16px;">' +
            '<div class="form-group">' +
              '<label>Segmento</label>' +
              '<select id="addSeg" onchange="updateSerieOpts()">' + segOpts + '</select>' +
            '</div>' +
            '<div class="form-group">' +
              '<label>Série</label>' +
              '<select id="addSerie"></select>' +
            '</div>' +
            '<div class="form-group">' +
              '<label>Turma</label>' +
              '<select id="addLetra">' +
              Store.LETRAS_TURMA.concat(['E']).map(function(l) { return '<option>' + l + '</option>'; }).join('') +
              '</select>' +
            '</div>' +
            '<button class="btn btn-primary" onclick="addTurma()" style="align-self:flex-end;">+ Adicionar</button>' +
          '</div>' +
          '<div id="turmasAtivas" style="display:flex;flex-wrap:wrap;gap:8px;">' + turmasHTML + '</div>' +
        '</div>' +
      '</div>';
    }

    // ─── Build Fórmula de Notas section ──────────────────
    function buildFormulaSection() {
      var cfg = notaCfg;
      return '<div class="card" style="margin-bottom:24px;">' +
        '<div class="card-header"><h3>Fórmula de Notas</h3></div>' +
        '<div class="card-body">' +
          '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;">' +

            '<div>' +
              '<label style="display:flex;align-items:center;gap:10px;margin-bottom:16px;cursor:pointer;">' +
                '<input type="checkbox" id="chkUsarPB" ' + (cfg.usarPB ? 'checked' : '') + ' onchange="togglePBFields()" style="width:18px;height:18px;accent-color:var(--lidara-green);">' +
                '<span style="font-weight:600;font-size:0.88rem;">Usar Prova Bimestral</span>' +
              '</label>' +
              '<label style="display:flex;align-items:center;gap:10px;cursor:pointer;">' +
                '<input type="checkbox" id="chkUsarAnglo" ' + (cfg.usarAnglo !== false ? 'checked' : '') + ' style="width:18px;height:18px;accent-color:var(--lidara-green);">' +
                '<span style="font-weight:600;font-size:0.88rem;">Sistema Anglo (PB = Anglo×1 + Prova×5)</span>' +
              '</label>' +
            '</div>' +

            '<div id="pesoFields">' +
              '<div class="form-row" style="flex-wrap:nowrap;">' +
                '<div class="form-group" id="pesoPBGroup">' +
                  '<label>Peso PB (%)</label>' +
                  '<input type="number" id="inputPesoPB" value="' + cfg.pesoPB + '" min="0" max="100" style="width:90px;">' +
                '</div>' +
                '<div class="form-group">' +
                  '<label>Peso Quali (%)</label>' +
                  '<input type="number" id="inputPesoQuali" value="' + cfg.pesoQuali + '" min="0" max="100" style="width:90px;">' +
                '</div>' +
                '<div class="form-group">' +
                  '<label>Peso VA (%)</label>' +
                  '<input type="number" id="inputPesoVA" value="' + cfg.pesoVA + '" min="0" max="100" style="width:90px;">' +
                '</div>' +
              '</div>' +
              '<span id="pesoSomaMsg" style="font-size:0.75rem;color:var(--gray-400);">Soma dos pesos deve ser 100%</span>' +
            '</div>' +

            '<div class="form-group">' +
              '<label>Nota Mínima para Aprovação</label>' +
              '<input type="number" id="inputNotaMin" value="' + (cfg.notaMinima || 6.0) + '" min="0" max="10" step="0.1" style="width:120px;">' +
            '</div>' +

          '</div>' +
          '<div style="margin-top:20px;">' +
            '<button class="btn btn-primary" onclick="saveFormula()">Salvar Fórmula</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    }

    // ─── Build Matérias section ───────────────────────────
    function buildMateriasSection() {
      var custom = Store.getMateriasCustom();
      var customHTML = custom.length > 0
        ? custom.map(function(m) {
            return '<span style="display:inline-flex;align-items:center;gap:4px;background:var(--bg-page);border:1px solid var(--border);border-radius:20px;padding:4px 12px;font-size:0.8rem;font-weight:600;">' +
              m +
              '<button onclick="removeMateria(\'' + m.replace(/'/g, "\\'") + '\')" style="background:none;border:none;cursor:pointer;color:var(--gray-400);font-size:0.9rem;line-height:1;padding:0 0 0 4px;">×</button>' +
            '</span>';
          }).join('')
        : '<span style="font-size:0.82rem;color:var(--gray-400);font-style:italic;">Nenhuma matéria customizada.</span>';

      return '<div class="card" style="margin-bottom:32px;">' +
        '<div class="card-header"><h3>Matérias Customizadas</h3></div>' +
        '<div class="card-body">' +
          '<p style="font-size:0.82rem;color:var(--gray-500);margin-bottom:12px;">Matérias padrão já incluídas. Adicione abaixo matérias específicas da sua escola.</p>' +
          '<div class="form-row" style="margin-bottom:16px;">' +
            '<div class="form-group" style="flex:1;">' +
              '<label>Nome da Matéria</label>' +
              '<input type="text" id="inputNovaMateria" placeholder="Ex: Iniciação Científica" />' +
            '</div>' +
            '<button class="btn btn-primary" onclick="addMateria()" style="align-self:flex-end;">+ Adicionar</button>' +
          '</div>' +
          '<div id="materiasCustomList" style="display:flex;flex-wrap:wrap;gap:8px;">' + customHTML + '</div>' +
        '</div>' +
      '</div>';
    }

    document.getElementById('app').innerHTML =
      Components.sidebar('configuracoes') +
      '<div class="main-content">' +
        Components.topbar('Configurações', false) +
        '<div class="page-container">' +

          // ── Sistema ──
          '<div class="card" style="margin-bottom:24px;">' +
            '<div class="card-header"><h3>Sistema</h3></div>' +
            '<div class="card-body" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;">' +

              '<div class="form-group">' +
                '<label>Ano Letivo</label>' +
                '<div style="display:flex;gap:8px;">' +
                  '<input type="number" id="inputAnoLetivo" value="' + config.anoLetivo + '" min="2020" max="2050" />' +
                  '<button class="btn btn-primary" onclick="saveAnoLetivo()">Salvar</button>' +
                '</div>' +
              '</div>' +

              '<div class="form-group">' +
                '<label>Ações</label>' +
                '<div style="display:flex;gap:8px;flex-wrap:wrap;">' +
                  '<a href="perfil.html" class="btn btn-outline" style="text-decoration:none;">Meu Perfil</a>' +
                  '<button class="btn btn-outline" onclick="exportAllData()">Exportar Dados</button>' +
                  '<button class="btn btn-outline" style="color:var(--red);border-color:var(--red);" onclick="clearAllData()">Limpar Dados</button>' +
                '</div>' +
              '</div>' +

            '</div>' +
          '</div>' +

          buildTurmasSection() +
          buildFormulaSection() +
          buildMateriasSection() +

          '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;">' +
            '<div>' +
              '<h2 style="font-size:1.2rem;font-weight:800;color:var(--lidara-dark);margin-bottom:4px;">Manual de Instruções</h2>' +
              '<p style="font-size:0.85rem;color:var(--gray-500);">Aprenda a usar todas as funcionalidades do Lidara</p>' +
            '</div>' +
            '<button class="expand-all-btn" onclick="toggleAll()">Expandir Tudo</button>' +
          '</div>' +

          '<div id="manualContent"></div>' +

        '</div>' +
        Components.footer() +
      '</div>';

    function saveAnoLetivo() {
      var ano = parseInt(document.getElementById('inputAnoLetivo').value);
      if (ano < 2020 || ano > 2050) {
        alert('Ano invalido. Use um valor entre 2020 e 2050.');
        return;
      }
      Store.setAnoLetivo(ano);
      alert('Ano letivo atualizado para ' + ano + '! Recarregando...');
      location.reload();
    }

    function exportAllData() {
      var data = Store.exportData();
      data.config = Store.getConfig();
      data.profile = Store.getProfile();
      var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'picpaydei-backup-' + new Date().toISOString().split('T')[0] + '.json';
      a.click();
      URL.revokeObjectURL(url);
    }

    function clearAllData() {
      if (!confirm('ATENÇÃO: Isso irá apagar TODOS os dados (alunos, notas, configurações)!')) return;
      if (!confirm('Tem certeza absoluta? Esta ação não pode ser desfeita!')) return;
      Store.clearAll();
      localStorage.removeItem('picpay_dei_config');
      localStorage.removeItem('picpay_dei_profile');
      alert('Todos os dados foram apagados. Recarregando...');
      location.reload();
    }

    // ─── Turmas ──────────────────────────────────────────
    function updateSerieOpts() {
      var seg = document.getElementById('addSeg').value;
      var segs = Store.SEGMENTOS;
      var opts = segs[seg].series.map(function(s) { return '<option value="' + s + '">' + s + '</option>'; }).join('');
      document.getElementById('addSerie').innerHTML = opts;
    }
    // Init serie opts on load
    setTimeout(updateSerieOpts, 0);

    function addTurma() {
      var seg = document.getElementById('addSeg').value;
      var serie = document.getElementById('addSerie').value;
      var letra = document.getElementById('addLetra').value;
      var codigo = seg === 'EM' ? (serie + 'EM' + letra) : (serie + seg + letra);
      var prof = Store.getProfessor();
      prof.turmasConfig = prof.turmasConfig || [];
      if (prof.turmasConfig.indexOf(codigo) !== -1) {
        alert('Turma ' + Store.formatTurma(codigo) + ' já existe.');
        return;
      }
      prof.turmasConfig.push(codigo);
      Store.setProfessor(prof);
      refreshTurmasAtivas();
    }

    function removeTurma(codigo) {
      var prof = Store.getProfessor();
      prof.turmasConfig = (prof.turmasConfig || []).filter(function(t) { return t !== codigo; });
      Store.setProfessor(prof);
      refreshTurmasAtivas();
    }

    function refreshTurmasAtivas() {
      var prof = Store.getProfessor();
      var turmasAtivas = (prof.turmasConfig || []);
      var el = document.getElementById('turmasAtivas');
      if (!el) return;
      if (turmasAtivas.length === 0) {
        el.innerHTML = '<span style="font-size:0.82rem;color:var(--gray-400);font-style:italic;">Nenhuma turma adicionada. Usando padrão do sistema.</span>';
        return;
      }
      el.innerHTML = turmasAtivas.map(function(t) {
        return '<span style="display:inline-flex;align-items:center;gap:4px;background:var(--bg-page);border:1px solid var(--border);border-radius:20px;padding:4px 12px;font-size:0.8rem;font-weight:600;">' +
          Store.formatTurma(t) +
          '<button onclick="removeTurma(\'' + t + '\')" style="background:none;border:none;cursor:pointer;color:var(--gray-400);font-size:0.9rem;line-height:1;padding:0 0 0 4px;">×</button>' +
        '</span>';
      }).join('');
    }

    // ─── Fórmula ─────────────────────────────────────────
    function togglePBFields() {
      var usarPB = document.getElementById('chkUsarPB').checked;
      var pbGroup = document.getElementById('pesoPBGroup');
      if (pbGroup) pbGroup.style.display = usarPB ? '' : 'none';
      updateSomaMsg();
    }

    function updateSomaMsg() {
      var usarPB = document.getElementById('chkUsarPB').checked;
      var pb = usarPB ? (parseInt(document.getElementById('inputPesoPB').value) || 0) : 0;
      var q = parseInt(document.getElementById('inputPesoQuali').value) || 0;
      var v = parseInt(document.getElementById('inputPesoVA').value) || 0;
      var soma = pb + q + v;
      var msg = document.getElementById('pesoSomaMsg');
      if (msg) {
        msg.textContent = 'Soma dos pesos: ' + soma + '% ' + (soma === 100 ? '✓' : '(deve ser 100%)');
        msg.style.color = soma === 100 ? 'var(--lidara-green)' : 'var(--red)';
      }
    }

    // Add listeners after DOM ready
    setTimeout(function() {
      ['inputPesoPB','inputPesoQuali','inputPesoVA'].forEach(function(id) {
        var el = document.getElementById(id);
        if (el) el.addEventListener('input', updateSomaMsg);
      });
      togglePBFields();
      updateSomaMsg();
    }, 0);

    function saveFormula() {
      var usarPB = document.getElementById('chkUsarPB').checked;
      var pesoPB = parseInt(document.getElementById('inputPesoPB').value) || 0;
      var pesoQ = parseInt(document.getElementById('inputPesoQuali').value) || 0;
      var pesoVA = parseInt(document.getElementById('inputPesoVA').value) || 0;
      var soma = (usarPB ? pesoPB : 0) + pesoQ + pesoVA;
      if (soma !== 100) {
        alert('A soma dos pesos deve ser exatamente 100%. Atual: ' + soma + '%');
        return;
      }
      var notaMin = parseFloat(document.getElementById('inputNotaMin').value) || 6.0;
      var usarAnglo = document.getElementById('chkUsarAnglo').checked;
      Store.setNotaConfig({ usarPB: usarPB, pesoPB: pesoPB, pesoQuali: pesoQ, pesoVA: pesoVA, notaMinima: notaMin, usarAnglo: usarAnglo });
      alert('Fórmula de notas salva!');
    }

    // ─── Matérias customizadas ────────────────────────────
    function addMateria() {
      var nome = document.getElementById('inputNovaMateria').value.trim();
      if (!nome) return;
      var custom = Store.getMateriasCustom();
      if (custom.indexOf(nome) !== -1) { alert('Matéria já existe.'); return; }
      custom.push(nome);
      Store.setMateriasCustom(custom);
      document.getElementById('inputNovaMateria').value = '';
      refreshMateriasCustom();
    }

    function removeMateria(nome) {
      var custom = Store.getMateriasCustom().filter(function(m) { return m !== nome; });
      Store.setMateriasCustom(custom);
      refreshMateriasCustom();
    }

    function refreshMateriasCustom() {
      var custom = Store.getMateriasCustom();
      var el = document.getElementById('materiasCustomList');
      if (!el) return;
      if (custom.length === 0) {
        el.innerHTML = '<span style="font-size:0.82rem;color:var(--gray-400);font-style:italic;">Nenhuma matéria customizada.</span>';
        return;
      }
      el.innerHTML = custom.map(function(m) {
        return '<span style="display:inline-flex;align-items:center;gap:4px;background:var(--bg-page);border:1px solid var(--border);border-radius:20px;padding:4px 12px;font-size:0.8rem;font-weight:600;">' +
          m +
          '<button onclick="removeMateria(\'' + m.replace(/'/g, "\\'") + '\')" style="background:none;border:none;cursor:pointer;color:var(--gray-400);font-size:0.9rem;line-height:1;padding:0 0 0 4px;">×</button>' +
        '</span>';
      }).join('');
    }

    var allExpanded = false;

    function toggleAll() {
      allExpanded = !allExpanded;
      var btn = document.querySelector('.expand-all-btn');
      btn.textContent = allExpanded ? 'Recolher Tudo' : 'Expandir Tudo';
      document.querySelectorAll('.manual-card').forEach(function(card) {
        var head = card.querySelector('.manual-card-head');
        var body = card.querySelector('.manual-card-body');
        if (allExpanded) {
          head.classList.add('open');
          body.classList.add('open');
        } else {
          head.classList.remove('open');
          body.classList.remove('open');
        }
      });
    }

    function toggleManualCard(el) {
      var head = el;
      var body = el.nextElementSibling;
      head.classList.toggle('open');
      body.classList.toggle('open');
    }

    var manualData = [
      {
        category: 'Primeiros Passos',
        items: [
          {
            title: 'Entendendo a Interface',
            content: `
              <p>O <strong>picpay.de.i</strong> é um sistema de gerenciamento escolar com navegação intuitiva:</p>
              <ul>
                <li><strong>Sidebar (Menu Lateral):</strong> Acesso rápido a todas as páginas</li>
                <li><strong>Topbar (Barra Superior):</strong> Seleção de Bimestre, Turma e Matéria</li>
                <li><strong>Área Principal:</strong> Conteúdo da página atual</li>
              </ul>
              <div class="tip">
                <p><strong>Dica:</strong> Em dispositivos móveis, clique no ícone ☰ para abrir o menu lateral.</p>
              </div>
            `
          },
          {
            title: 'Selecionando o Contexto (Turma/Matéria/Bimestre)',
            content: `
              <p>Antes de qualquer ação, selecione o contexto correto na barra superior:</p>
              <ul>
                <li><strong>Bimestre:</strong> 1º, 2º, 3º ou 4º Bimestre</li>
                <li><strong>Turma:</strong> 6A-6D, 8A-8C ou 9A-9D</li>
                <li><strong>Matéria:</strong> Varia conforme a turma selecionada</li>
              </ul>
              <p>As matérias disponíveis por ano:</p>
              <ul>
                <li><strong>6º Ano:</strong> LEM, Produção de Texto</li>
                <li><strong>8º Ano:</strong> Português, Produção de Texto</li>
                <li><strong>9º Ano:</strong> LEM</li>
              </ul>
              <div class="tip">
                <p><strong>Importante:</strong> O contexto é salvo automaticamente. Ao reabrir o site, você volta para a última seleção.</p>
              </div>
            `
          }
        ]
      },
      {
        category: 'Gerenciamento de Alunos',
        items: [
          {
            title: 'Cadastrando Alunos',
            content: `
              <p>Na página <strong>Alunos</strong>, você pode cadastrar alunos de duas formas:</p>
              <p><strong>1. Cadastro Individual:</strong></p>
              <ul>

    function renderManual() {
      var html = '';
      var stepNum = 1;

      manualData.forEach(function(category) {
        html += '<div class="category-title">' + category.category + '</div>';
        html += '<div class="manual-section">';

        category.items.forEach(function(item) {
          html += '<div class="manual-card">';
          html += '<div class="manual-card-head" onclick="toggleManualCard(this)">';
          html += '<h3><span class="step-num">' + stepNum + '</span>' + item.title + '</h3>';
          html += '<span class="arrow">▼</span>';
          html += '</div>';
          html += '<div class="manual-card-body">' + item.content + '</div>';
          html += '</div>';
          stepNum++;
        });

        html += '</div>';
      });

      document.getElementById('manualContent').innerHTML = html;
    }

    renderManual();
  </script>
