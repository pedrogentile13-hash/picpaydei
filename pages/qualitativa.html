<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Qualitativa — Lidara</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="../assets/js/firebase-config.js"></script>
  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/auth-guard.js"></script>

  <div id="app" style="visibility:hidden;"></div>

  <script>
    document.getElementById('app').innerHTML =
      Components.sidebar('qualitativa') +
      '<div class="main-content">' +
        Components.topbar('Qualitativa') +
        '<div class="page-container">' +

          '<div class="summary-grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:24px;">' +
            '<div class="summary-card">' +
              '<div class="label">Alunos</div>' +
              '<div class="value dark" id="stat-total">0</div>' +
            '</div>' +
            '<div class="summary-card">' +
              '<div class="label">Média Quali</div>' +
              '<div class="value green" id="stat-media">0.0</div>' +
            '</div>' +
            '<div class="summary-card">' +
              '<div class="label">Média Final</div>' +
              '<div class="value dark" id="stat-final">0.0</div>' +
            '</div>' +
            '<div class="summary-card">' +
              '<div class="label">Com Ajuste</div>' +
              '<div class="value dark" id="stat-desconto">0</div>' +
            '</div>' +
          '</div>' +

          '<div class="card">' +
            '<div class="card-header">' +
              '<h3>Notas Qualitativas</h3>' +
              '<span style="font-size:0.75rem;color:var(--gray-400);font-weight:600;">Nota Final = Quali + Bonus - Desconto (0 a 10)</span>' +
            '</div>' +
            '<div class="table-container">' +
              '<table>' +
                '<thead>' +
                  '<tr>' +
                    '<th style="text-align:left;">N</th>' +
                    '<th style="text-align:left;">Aluno</th>' +
                    '<th style="text-align:center;">Nota Quali</th>' +
                    '<th style="text-align:center;">Positivos</th>' +
                    '<th style="text-align:center;">Negativos</th>' +
                    '<th style="text-align:center;">Ajuste</th>' +
                    '<th style="text-align:center;">Nota Final</th>' +
                  '</tr>' +
                '</thead>' +
                '<tbody id="tbodyQuali"></tbody>' +
              '</table>' +
              '<div id="emptyState" class="empty-state">Nenhum aluno cadastrado. Va em <a href="alunos.html" style="color:var(--green);font-weight:600;">Alunos</a> para adicionar.</div>' +
            '</div>' +
          '</div>' +

          '<p style="margin-top:12px;font-size:0.75rem;color:var(--gray-400);">' +
            '* Clique na celula da Nota Quali para editar. Bonus = Positivos x 0.1. Desconto = Negativos x 0.1. Nota Final limitada entre 0 e 10.' +
          '</p>' +

        '</div>' +
        Components.footer() +
      '</div>';

    initSelects();

    function onContextChange() { render(); }

    function onQualiBlur(numero) {
      var input = document.getElementById('quali-' + numero);
      var val = parseFloat(input.value);
      if (isNaN(val) || val < 0) val = 0;
      if (val > 10) val = 10;
      input.value = val;

      var ctx = getCurrentContext();
      var students = Store.getStudents(ctx.turma, ctx.materia, ctx.bimestre);
      var s = students.find(function(st) { return st.numero === numero; });
      if (s) {
        s.quali = val;
        Store.setStudents(ctx.turma, ctx.materia, ctx.bimestre, students);
      }
      render();
    }

    function onQualiKeydown(e, numero) {
      if (e.key === 'Enter') {
        e.target.blur();
      } else if (e.key === 'Tab') {
        e.preventDefault();
        e.target.blur();
        // Focus next input
        var inputs = document.querySelectorAll('.quali-input');
        for (var i = 0; i < inputs.length; i++) {
          if (inputs[i].id === 'quali-' + numero && i + 1 < inputs.length) {
            inputs[i + 1].focus();
            inputs[i + 1].select();
            break;
          }
        }
      }
    }

    function buildRow(s) {
      var positivos = s.positivos || 0;
      var bonus = +(positivos * 0.1).toFixed(1);
      var desconto = +(s.negativos * 0.1).toFixed(1);
      var ajuste = +(bonus - desconto).toFixed(1);
      var notaFinal = +Math.min(10, Math.max(0, s.quali + ajuste)).toFixed(2);
      var ajusteColor = ajuste > 0 ? 'var(--green)' : (ajuste < 0 ? 'var(--red)' : 'var(--gray-400)');
      var ajusteText = ajuste > 0 ? '+' + ajuste : (ajuste < 0 ? ajuste : '0.0');
      var finalColor = notaFinal >= 6 ? 'badge-green' : (notaFinal > 0 ? 'badge-red' : '');
      var finalBadge = finalColor ? ' class="badge ' + finalColor + '"' : ' style="color:var(--gray-400);"';

      return '<tr>' +
        '<td style="font-weight:700;color:var(--dark);">' + s.numero + '</td>' +
        '<td>' + s.nome + '</td>' +
        '<td style="text-align:center;">' +
          '<input type="number" id="quali-' + s.numero + '" class="quali-input" ' +
            'value="' + s.quali + '" min="0" max="10" step="0.1" ' +
            'onblur="onQualiBlur(' + s.numero + ')" ' +
            'onkeydown="onQualiKeydown(event,' + s.numero + ')" ' +
            'style="width:70px;text-align:center;padding:6px 8px;border:2px solid var(--gray-200);border-radius:8px;font-weight:700;font-size:0.95rem;outline:none;transition:border-color 0.2s;" ' +
            'onfocus="this.style.borderColor=\'var(--green)\'" ' +
            'onblur="this.style.borderColor=\'var(--gray-200)\';onQualiBlur(' + s.numero + ')" />' +
        '</td>' +
        '<td style="text-align:center;font-weight:700;color:' + (positivos > 0 ? 'var(--green)' : 'var(--gray-400)') + ';">' + positivos + '</td>' +
        '<td style="text-align:center;font-weight:700;color:' + (s.negativos > 0 ? 'var(--red)' : 'var(--gray-400)') + ';">' + s.negativos + '</td>' +
        '<td style="text-align:center;font-weight:700;color:' + ajusteColor + ';">' + ajusteText + '</td>' +
        '<td style="text-align:center;"><span' + finalBadge + '>' + notaFinal + '</span></td>' +
      '</tr>';
    }

    function render() {
      var ctx = getCurrentContext();
      var students = Store.getStudents(ctx.turma, ctx.materia, ctx.bimestre);
      var tbody = document.getElementById('tbodyQuali');
      var empty = document.getElementById('emptyState');

      document.getElementById('stat-total').textContent = students.length;

      if (students.length === 0) {
        tbody.innerHTML = '';
        empty.style.display = '';
        document.getElementById('stat-media').textContent = '0.0';
        document.getElementById('stat-final').textContent = '0.0';
        document.getElementById('stat-desconto').textContent = '0';
        return;
      }
      empty.style.display = 'none';

      var somaQuali = 0;
      var somaFinal = 0;
      var comAjuste = 0;
      students.forEach(function(s) {
        somaQuali += s.quali;
        var positivos = s.positivos || 0;
        var ajuste = positivos * 0.1 - s.negativos * 0.1;
        var notaFinal = Math.min(10, Math.max(0, s.quali + ajuste));
        somaFinal += notaFinal;
        if (ajuste !== 0) comAjuste++;
      });

      document.getElementById('stat-media').textContent = (somaQuali / students.length).toFixed(1);
      document.getElementById('stat-final').textContent = (somaFinal / students.length).toFixed(1);
      document.getElementById('stat-desconto').textContent = comAjuste;

      tbody.innerHTML = students.map(buildRow).join('');
    }

    render();
    Store.loadFromCloud(function(success) { if (success) render(); });
  </script>
</body>
</html>
