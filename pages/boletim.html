<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boletim — Lidara</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="../assets/js/firebase-config.js"></script>
  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/auth-guard.js"></script>

  <div id="app" style="visibility:hidden;"></div>

  <script>
    document.getElementById('app').innerHTML =
      Components.sidebar('boletim') +
      '<div class="main-content">' +
        Components.topbar('Boletim') +
        '<div class="page-container">' +

          // Formula card (dynamic based on matéria)
          '<div id="formulaCard"></div>' +

          // VA info
          '<div id="vaInfo" style="margin-bottom:12px;"></div>' +

          // Table
          '<div class="card">' +
            '<div class="card-header"><h3>Lan\u00e7amento de Notas</h3><span style="font-size:0.78rem;color:var(--gray-400);font-weight:600;" id="countLabel">0 aluno(s)</span></div>' +
            '<div class="table-container">' +
              '<table>' +
                '<thead id="theadBoletim"></thead>' +
                '<tbody id="tbodyBoletim"></tbody>' +
              '</table>' +
              '<div id="emptyState" class="empty-state">Nenhum aluno cadastrado nesta turma/mat\u00e9ria/bimestre.</div>' +
            '</div>' +
          '</div>' +

          // Charts
          '<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px;">' +
            '<div class="card">' +
              '<div class="card-header"><h3>Composi\u00e7\u00e3o da M\u00e9dia</h3></div>' +
              '<div class="card-body" style="display:flex;justify-content:center;"><div style="max-width:240px;width:100%;"><canvas id="chartPie"></canvas></div></div>' +
            '</div>' +
            '<div class="card">' +
              '<div class="card-header"><h3>M\u00e9dias por Aluno</h3></div>' +
              '<div class="card-body"><canvas id="chartMedias"></canvas></div>' +
            '</div>' +
          '</div>' +

        '</div>' +
        Components.footer() +
      '</div>';

    initSelects();
    var chartPie = null;
    var chartMedias = null;

    function onContextChange() { render(); }

    function onNotaChange(numero, field, value) {
      var ctx = getCurrentContext();
      Store.updateNota(ctx.turma, ctx.materia, ctx.bimestre, numero, field, value);
      render();
    }

    function buildRow(s, ctx, hasPB) {
      var qualiEf = Store.getQualiAjustada(s);
      var vaMedia = Store.getVAMedia(ctx.turma, ctx.materia, ctx.bimestre, s.numero);
      var media = Store.calcMediaFull(ctx.turma, ctx.materia, ctx.bimestre, s);
      var mediaColor = media >= 6 ? 'badge-green' : 'badge-red';
      var negLabel = s.negativos > 0
        ? '<span style="display:block;font-size:0.65rem;color:var(--red);">(-' + (s.negativos * 0.1).toFixed(1) + ')</span><span style="display:block;font-size:0.65rem;color:var(--gray-400);">Efetiva: ' + qualiEf.toFixed(1) + '</span>'
        : '';
      var vaCount = Store.getVAs(ctx.turma, ctx.materia, ctx.bimestre).length;
      var vaDisplay = vaCount > 0
        ? '<span style="font-weight:600;font-size:0.9rem;">' + vaMedia.toFixed(1) + '</span><span style="display:block;font-size:0.65rem;color:var(--gray-400);">' + vaCount + ' VA(s)</span>'
        : '<span style="font-size:0.75rem;color:var(--gray-400);font-style:italic;">Nenhuma VA</span>';

      var row = '<tr>' +
        '<td style="font-weight:700;color:var(--dark);">' + s.numero + '</td>' +
        '<td>' + s.nome + '</td>' +
        '<td style="text-align:center;">' +
          '<input type="number" step="0.1" min="0" max="10" value="' + s.quali + '" onchange="onNotaChange(' + s.numero + ',\'quali\',this.value)" class="editable-input" />' +
          negLabel +
        '</td>';

      if (hasPB) {
        var pbMedia = Store.getPBMedia(ctx.turma, ctx.materia, ctx.bimestre, s.numero);
        row += '<td style="text-align:center;">' +
          '<span style="font-weight:600;font-size:0.9rem;">' + pbMedia.toFixed(1) + '</span>' +
          '<span style="display:block;font-size:0.65rem;color:var(--gray-400);"><a href="pb.html" style="color:var(--green);text-decoration:underline;">Editar PB</a></span>' +
        '</td>';
      }

      row += '<td style="text-align:center;">' + vaDisplay + '</td>' +
        '<td style="text-align:center;"><span class="badge ' + mediaColor + '">' + media + '</span></td>' +
      '</tr>';
      return row;
    }

    function render() {
      var ctx = getCurrentContext();
      var hasPB = Store.hasPB(ctx.materia);
      var students = Store.getStudents(ctx.turma, ctx.materia, ctx.bimestre);
      var vas = Store.getVAs(ctx.turma, ctx.materia, ctx.bimestre);
      var thead = document.getElementById('theadBoletim');
      var tbody = document.getElementById('tbodyBoletim');
      var empty = document.getElementById('emptyState');
      document.getElementById('countLabel').textContent = students.length + ' aluno(s)';

      // Update formula card
      var formulaCard = document.getElementById('formulaCard');
      if (hasPB) {
        formulaCard.innerHTML =
          '<div class="card" style="margin-bottom:20px;">' +
            '<div class="card-body" style="padding:16px 20px;">' +
              '<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;">' +
                '<div>' +
                  '<h3 style="font-size:0.85rem;font-weight:700;color:var(--dark);margin-bottom:4px;">F\u00f3rmula da M\u00e9dia \u2014 ' + ctx.materia + '</h3>' +
                  '<p style="font-size:0.8rem;color:var(--gray-500);font-family:monospace;">M = (PB \u00d7 35 + Quali* \u00d7 30 + VA \u00d7 35) / 100</p>' +
                  '<p style="font-size:0.7rem;color:var(--gray-400);margin-top:4px;">* Quali = Nota Qualitativa - (Negativos \u00d7 0.1) | PB = (Anglo\u00d71 + Prova\u00d75) / 6 | VA = m\u00e9dia das VAs normalizadas</p>' +
                '</div>' +
                '<div style="display:flex;gap:10px;">' +
                  '<div style="text-align:center;padding:8px 14px;background:#DBEAFE;border-radius:10px;"><div style="font-size:0.65rem;color:#1D4ED8;font-weight:700;">PB</div><div style="font-size:1.1rem;font-weight:800;color:#1D4ED8;">35</div></div>' +
                  '<div style="text-align:center;padding:8px 14px;background:#FEE2E2;border-radius:10px;"><div style="font-size:0.65rem;color:#991B1B;font-weight:700;">QUALI</div><div style="font-size:1.1rem;font-weight:800;color:#991B1B;">30</div></div>' +
                  '<div style="text-align:center;padding:8px 14px;background:#FEF3C7;border-radius:10px;"><div style="font-size:0.65rem;color:#92400E;font-weight:700;">VA</div><div style="font-size:1.1rem;font-weight:800;color:#92400E;">35</div></div>' +
                '</div>' +
              '</div>' +
            '</div>' +
          '</div>';
      } else {
        formulaCard.innerHTML =
          '<div class="card" style="margin-bottom:20px;">' +
            '<div class="card-body" style="padding:16px 20px;">' +
              '<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;">' +
                '<div>' +
                  '<h3 style="font-size:0.85rem;font-weight:700;color:var(--dark);margin-bottom:4px;">F\u00f3rmula da M\u00e9dia \u2014 ' + ctx.materia + ' (sem PB)</h3>' +
                  '<p style="font-size:0.8rem;color:var(--gray-500);font-family:monospace;">M = (Quali* \u00d7 30 + VA \u00d7 35) / 65</p>' +
                  '<p style="font-size:0.7rem;color:var(--gray-400);margin-top:4px;">* Quali = Nota Qualitativa - (Negativos \u00d7 0.1) | VA = m\u00e9dia das VAs normalizadas</p>' +
                '</div>' +
                '<div style="display:flex;gap:10px;">' +
                  '<div style="text-align:center;padding:8px 14px;background:#FEE2E2;border-radius:10px;"><div style="font-size:0.65rem;color:#991B1B;font-weight:700;">QUALI</div><div style="font-size:1.1rem;font-weight:800;color:#991B1B;">30</div></div>' +
                  '<div style="text-align:center;padding:8px 14px;background:#FEF3C7;border-radius:10px;"><div style="font-size:0.65rem;color:#92400E;font-weight:700;">VA</div><div style="font-size:1.1rem;font-weight:800;color:#92400E;">35</div></div>' +
                '</div>' +
              '</div>' +
            '</div>' +
          '</div>';
      }

      // VA info bar
      var vaInfo = document.getElementById('vaInfo');
      if (vas.length > 0) {
        vaInfo.innerHTML = '<div style="background:#FFFBEB;border:1px solid #FDE68A;border-radius:12px;padding:12px 16px;font-size:0.8rem;color:#92400E;">' +
          '<strong>' + vas.length + ' VA(s) cadastrada(s):</strong> ' +
          vas.map(function(v) { return v.nome + ' (0-' + v.valorMax + ')'; }).join(', ') +
          ' \u2014 <a href="va.html" style="color:#1D4ED8;text-decoration:underline;">Gerenciar VAs</a>' +
          '</div>';
      } else {
        vaInfo.innerHTML = '<div style="background:var(--gray-50);border:1px solid var(--gray-200);border-radius:12px;padding:12px 16px;font-size:0.8rem;color:var(--gray-500);">' +
          'Nenhuma VA cadastrada. <a href="va.html" style="color:var(--green);text-decoration:underline;">Criar VAs</a> para que a coluna VA seja calculada automaticamente.' +
          '</div>';
      }

      // Build table header dynamically
      var thHtml = '<tr>' +
        '<th style="text-align:left;">N\u00ba</th>' +
        '<th style="text-align:left;">Nome</th>' +
        '<th style="text-align:center;">Qualitativa<br><span style="font-weight:400;opacity:0.7;">(Peso 30)</span></th>';

      if (hasPB) {
        thHtml += '<th style="text-align:center;">PB<br><span style="font-weight:400;opacity:0.7;">(Peso 35)</span></th>';
      }

      thHtml += '<th style="text-align:center;">VA<br><span style="font-weight:400;opacity:0.7;">(Peso 35)</span></th>' +
        '<th style="text-align:center;">M\u00e9dia</th>' +
      '</tr>';
      thead.innerHTML = thHtml;

      if (students.length === 0) {
        tbody.innerHTML = '';
        empty.style.display = '';
        return;
      }
      empty.style.display = 'none';

      tbody.innerHTML = students.map(function(s) { return buildRow(s, ctx, hasPB); }).join('');

      // Pie chart (composition)
      if (chartPie) chartPie.destroy();
      if (hasPB) {
        chartPie = new Chart(document.getElementById('chartPie'), {
          type: 'pie',
          data: {
            labels: ['Prova Bimestral (35)', 'Qualitativa (30)', 'VA (35)'],
            datasets: [{ data: [35, 30, 35], backgroundColor: ['#3B82F6', '#DC2626', '#F59E0B'], borderWidth: 2, borderColor: '#fff' }],
          },
          options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { font: { size: 11, family: 'Inter' }, padding: 12 } } } },
        });
      } else {
        chartPie = new Chart(document.getElementById('chartPie'), {
          type: 'pie',
          data: {
            labels: ['Qualitativa (30)', 'VA (35)'],
            datasets: [{ data: [30, 35], backgroundColor: ['#DC2626', '#F59E0B'], borderWidth: 2, borderColor: '#fff' }],
          },
          options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { font: { size: 11, family: 'Inter' }, padding: 12 } } } },
        });
      }

      // Bar chart (medias)
      var labels = students.map(function(s) { return s.nome.split(' ')[0]; });
      var medias = students.map(function(s) { return Store.calcMediaFull(ctx.turma, ctx.materia, ctx.bimestre, s); });
      var colors = medias.map(function(m) { return m >= 6 ? '#11C76F' : '#F87171'; });

      if (chartMedias) chartMedias.destroy();
      chartMedias = new Chart(document.getElementById('chartMedias'), {
        type: 'bar',
        data: { labels: labels, datasets: [{ label: 'M\u00e9dia', data: medias, backgroundColor: colors, borderRadius: 6, borderSkipped: false }] },
        options: {
          responsive: true,
          plugins: {
            legend: { display: false },
          },
          scales: { y: { beginAtZero: true, max: 10 }, x: { grid: { display: false } } }
        },
      });
    }

    render();
    Store.loadFromCloud(function(success) { if (success) render(); });
  </script>
</body>
</html>
