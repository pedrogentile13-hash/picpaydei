<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard VA — picpay.de.i</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    .dashboard-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:20px; margin-bottom:24px; }
    .ranking-item { display:flex; align-items:center; gap:12px; padding:12px 16px; background:var(--gray-50); border-radius:12px; margin-bottom:8px; }
    .ranking-item .medal { font-size:1.3rem; width:32px; text-align:center; }
    .ranking-item .info { flex:1; }
    .ranking-item .info .name { font-weight:700; font-size:0.9rem; color:var(--dark); }
    .ranking-item .info .sub { font-size:0.72rem; color:var(--gray-400); }
    .ranking-item .score { font-weight:800; font-size:1.1rem; }
    .filter-bar { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:24px; }
    .filter-bar select { padding:8px 14px; border-radius:10px; border:1px solid var(--gray-200); font-size:0.85rem; }
    .section-title { font-size:0.75rem; font-weight:700; color:var(--gray-500); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:12px; }
    .va-selector { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:24px; }
    .va-btn { padding:10px 18px; border-radius:10px; border:2px solid var(--gray-200); background:#fff; font-weight:600; cursor:pointer; transition:all 0.15s; }
    .va-btn:hover { border-color:var(--green); }
    .va-btn.active { border-color:var(--green); background:var(--green); color:#fff; }
    .va-tipo-badge { display:inline-block; padding:2px 8px; border-radius:12px; font-size:0.65rem; font-weight:700; margin-left:6px; }
    .empty-state { padding:60px 20px; text-align:center; color:var(--gray-400); }
  </style>
</head>
<body>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="../assets/js/firebase-config.js"></script>
  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/components.js"></script>

  <div id="app"></div>

  <script>
    document.getElementById('app').innerHTML =
      Components.sidebar('va-dashboard') +
      '<div class="main-content">' +
        Components.topbar('Dashboard VA', false) +
        '<div class="page-container">' +
          '<p style="color:var(--gray-500);margin-bottom:20px;">Comparativo de desempenho por VA específica entre turmas do mesmo ano.</p>' +

          // Filters
          '<div class="filter-bar">' +
            '<select id="filterAno" onchange="updateMateriaAndVAs()">' +
              '<option value="6">6º Ano</option>' +
              '<option value="8">8º Ano</option>' +
              '<option value="9">9º Ano</option>' +
            '</select>' +
            '<select id="filterMateria" onchange="updateVAsList()"></select>' +
            '<select id="filterBimestre" onchange="updateVAsList()">' +
              Store.BIMESTRES.map(function(b) { return '<option value="' + b + '">' + Store.BIMESTRE_LABELS[b] + '</option>'; }).join('') +
            '</select>' +
          '</div>' +

          // VA selector
          '<div id="vaSelector" class="va-selector"></div>' +

          '<div id="dashboardContent"></div>' +
        '</div>' +
        Components.footer() +
      '</div>';

    var chartComparativo = null;
    var selectedVAId = null;

    function getTipoBg(tipo) {
      switch(tipo) {
        case 'Trabalho': return 'background:#DBEAFE;color:#1D4ED8;';
        case 'Escrita': return 'background:#FEF3C7;color:#92400E;';
        case 'Caderno': return 'background:#D1FAE5;color:#065F46;';
        case 'Apresentação': return 'background:#EDE9FE;color:#5B21B6;';
        case 'Participação': return 'background:#FCE7F3;color:#9D174D;';
        case 'Prova': return 'background:#FEE2E2;color:#991B1B;';
        default: return 'background:#F3F4F6;color:#374151;';
      }
    }

    function updateMateriaAndVAs() {
      var ano = document.getElementById('filterAno').value;
      var materias = Store.materiasPor[ano] || [];
      document.getElementById('filterMateria').innerHTML = materias.map(function(m) {
        return '<option value="' + m + '">' + m + '</option>';
      }).join('');
      updateVAsList();
    }

    function getSalasDoAno(ano) {
      return Store.TURMAS.filter(function(t) { return t.charAt(0) === ano; });
    }

    function updateVAsList() {
      var ano = document.getElementById('filterAno').value;
      var materia = document.getElementById('filterMateria').value;
      var bimestre = document.getElementById('filterBimestre').value;

      if (!materia) {
        document.getElementById('vaSelector').innerHTML = '';
        document.getElementById('dashboardContent').innerHTML = '<div class="empty-state">Selecione uma matéria.</div>';
        return;
      }

      // Get VAs from first sala of the year (they're synced)
      var salas = getSalasDoAno(ano);
      var vas = [];
      for (var i = 0; i < salas.length; i++) {
        vas = Store.getVAs(salas[i], materia, bimestre);
        if (vas.length > 0) break;
      }

      var selector = document.getElementById('vaSelector');
      if (vas.length === 0) {
        selector.innerHTML = '';
        document.getElementById('dashboardContent').innerHTML = '<div class="empty-state">Nenhuma VA cadastrada para ' + ano + 'º Ano / ' + materia + ' / ' + Store.BIMESTRE_LABELS[bimestre] + '.</div>';
        selectedVAId = null;
        return;
      }

      // Render VA buttons
      var html = '<span style="font-size:0.8rem;font-weight:600;color:var(--gray-500);line-height:40px;">Selecione a VA:</span>';
      vas.forEach(function(va) {
        var active = selectedVAId === va.id ? ' active' : '';
        html += '<button class="va-btn' + active + '" onclick="selectVA(' + va.id + ')">';
        html += va.nome;
        html += '<span class="va-tipo-badge" style="' + getTipoBg(va.tipo) + '">' + va.tipo + '</span>';
        html += '</button>';
      });
      selector.innerHTML = html;

      // Auto-select first VA if none selected
      if (!selectedVAId || !vas.find(function(v) { return v.id === selectedVAId; })) {
        selectedVAId = vas[0].id;
        updateVAsList(); // Re-render with selection
        return;
      }

      renderDashboard();
    }

    function selectVA(vaId) {
      selectedVAId = vaId;
      updateVAsList();
    }

    function getVAData(ano, materia, bimestre, vaId) {
      var salas = getSalasDoAno(ano);
      var result = {
        vaInfo: null,
        salas: [],
        medias: [],
        melhores: []
      };

      salas.forEach(function(sala) {
        var vas = Store.getVAs(sala, materia, bimestre);
        var va = vas.find(function(v) { return v.id === vaId; });
        var students = Store.getStudents(sala, materia, bimestre);

        if (!va || students.length === 0) return;

        if (!result.vaInfo) {
          result.vaInfo = { nome: va.nome, tipo: va.tipo, valorMax: va.valorMax };
        }

        var total = 0;
        var melhor = { nome: '', nota: -1, sala: sala };

        students.forEach(function(s) {
          var norm = Store.getVANormalizada(va, s.numero);
          total += norm;
          if (norm > melhor.nota) {
            melhor = { nome: s.nome, nota: norm, sala: sala };
          }
        });

        result.salas.push(sala);
        result.medias.push(+(total / students.length).toFixed(1));
        if (melhor.nota > 0) result.melhores.push(melhor);
      });

      result.melhores.sort(function(a, b) { return b.nota - a.nota; });
      return result;
    }

    function renderRanking(items) {
      if (items.length === 0) return '<p style="color:var(--gray-400);font-style:italic;">Sem dados</p>';
      var medals = ['🥇', '🥈', '🥉'];
      var html = '';
      items.forEach(function(m, i) {
        var medal = medals[i] || (i + 1) + 'º';
        var scoreColor = m.nota >= 6 ? 'color:var(--green);' : 'color:var(--red);';
        html += '<div class="ranking-item">';
        html += '<span class="medal">' + medal + '</span>';
        html += '<div class="info"><div class="name">' + m.nome.split(' ')[0] + '</div><div class="sub">Turma ' + m.sala + '</div></div>';
        html += '<span class="score" style="' + scoreColor + '">' + m.nota.toFixed(1) + '</span>';
        html += '</div>';
      });
      return html;
    }

    function renderDashboard() {
      var ano = document.getElementById('filterAno').value;
      var materia = document.getElementById('filterMateria').value;
      var bimestre = document.getElementById('filterBimestre').value;
      var container = document.getElementById('dashboardContent');

      if (!selectedVAId) {
        container.innerHTML = '<div class="empty-state">Selecione uma VA acima.</div>';
        return;
      }

      var data = getVAData(ano, materia, bimestre, selectedVAId);

      if (data.salas.length === 0 || !data.vaInfo) {
        container.innerHTML = '<div class="card" style="padding:40px;text-align:center;color:var(--gray-400);">Nenhum dado para esta VA.</div>';
        return;
      }

      var html = '';

      // VA info header
      html += '<div class="card" style="margin-bottom:20px;">';
      html += '<div class="card-body" style="display:flex;align-items:center;justify-content:space-between;">';
      html += '<div>';
      html += '<h3 style="font-size:1.1rem;font-weight:800;color:var(--dark);margin-bottom:4px;">' + data.vaInfo.nome + '</h3>';
      html += '<span class="va-tipo-badge" style="' + getTipoBg(data.vaInfo.tipo) + '">' + data.vaInfo.tipo + '</span>';
      html += '</div>';
      html += '<div style="text-align:right;">';
      html += '<div style="font-size:0.75rem;color:var(--gray-500);">Valor máximo</div>';
      html += '<div style="font-size:1.5rem;font-weight:800;color:var(--dark);">' + data.vaInfo.valorMax + '</div>';
      html += '</div>';
      html += '</div></div>';

      // Grid
      html += '<div class="dashboard-grid">';

      // Ranking
      html += '<div class="card">';
      html += '<div class="card-header" style="background:var(--green);"><h3 style="color:#fff;">🏆 Melhores Notas por Turma</h3></div>';
      html += '<div class="card-body">' + renderRanking(data.melhores) + '</div>';
      html += '</div>';

      // Chart
      html += '<div class="card">';
      html += '<div class="card-header"><h3>Média por Turma — ' + data.vaInfo.nome + '</h3></div>';
      html += '<div class="card-body" style="height:280px;"><canvas id="chartComparativo"></canvas></div>';
      html += '</div>';

      html += '</div>';

      // Stats summary
      if (data.medias.length > 0) {
        var total = data.medias.reduce(function(a, b) { return a + b; }, 0);
        var mediaGeral = +(total / data.medias.length).toFixed(1);
        var melhorTurma = data.salas[data.medias.indexOf(Math.max.apply(null, data.medias))];
        var piorTurma = data.salas[data.medias.indexOf(Math.min.apply(null, data.medias))];

        html += '<div class="card" style="margin-top:20px;">';
        html += '<div class="card-body">';
        html += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:20px;text-align:center;">';

        html += '<div>';
        html += '<div style="font-size:0.72rem;color:var(--gray-500);font-weight:600;">MÉDIA GERAL</div>';
        html += '<div style="font-size:2rem;font-weight:800;color:' + (mediaGeral >= 6 ? 'var(--green)' : 'var(--red)') + ';">' + mediaGeral + '</div>';
        html += '</div>';

        html += '<div>';
        html += '<div style="font-size:0.72rem;color:var(--gray-500);font-weight:600;">MELHOR TURMA</div>';
        html += '<div style="font-size:2rem;font-weight:800;color:var(--green);">' + melhorTurma + '</div>';
        html += '</div>';

        html += '<div>';
        html += '<div style="font-size:0.72rem;color:var(--gray-500);font-weight:600;">TURMA A MELHORAR</div>';
        html += '<div style="font-size:2rem;font-weight:800;color:var(--red);">' + piorTurma + '</div>';
        html += '</div>';

        html += '</div></div></div>';
      }

      container.innerHTML = html;

      // Render chart
      if (chartComparativo) chartComparativo.destroy();
      var ctx = document.getElementById('chartComparativo');
      if (ctx && data.salas.length > 0) {
        chartComparativo = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: data.salas,
            datasets: [{
              label: 'Média',
              data: data.medias,
              backgroundColor: data.medias.map(function(m) { return m >= 6 ? '#11C76F' : '#F87171'; }),
              borderRadius: 8,
              borderSkipped: false
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              y: { beginAtZero: true, max: 10, grid: { color: '#f3f4f6' } },
              x: { grid: { display: false } }
            }
          }
        });
      }
    }

    // Initialize
    updateMateriaAndVAs();
    Store.loadFromCloud(function(success) { if (success) updateVAsList(); });
  </script>
</body>
</html>
