<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Negativos — picpay.de.i</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body>
  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/components.js"></script>

  <script>
    document.body.innerHTML = `
      ${Components.sidebar('negativos')}
      <div class="main-content">
        ${Components.topbar('Negativos')}
        <div class="page-container">

          <!-- Stats -->
          <div class="summary-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:24px;" id="negStats">
            <div class="summary-card">
              <div class="label">Alunos na Turma</div>
              <div class="value dark" id="stat-total">0</div>
            </div>
            <div class="summary-card">
              <div class="label">Total de Negativos</div>
              <div class="value red" id="stat-negs">0</div>
            </div>
            <div class="summary-card">
              <div class="label">Alunos Limpos</div>
              <div class="value green" id="stat-limpos">0</div>
            </div>
          </div>

          <!-- Table -->
          <div class="card">
            <div class="card-header">
              <h3>Gestão de Negativos</h3>
              <button class="btn btn-outline" onclick="resetAll()" style="font-size:0.75rem;padding:6px 14px;">Zerar Todos</button>
            </div>
            <div class="table-container">
              <table>
                <thead>
                  <tr>
                    <th style="text-align:left;">Nº</th>
                    <th style="text-align:left;">Nome</th>
                    <th style="text-align:center;">Negativos</th>
                    <th style="text-align:center;">Ações</th>
                  </tr>
                </thead>
                <tbody id="tbodyNegativos"></tbody>
              </table>
              <div id="emptyState" class="empty-state">Nenhum aluno cadastrado. Vá em <a href="alunos.html" style="color:var(--green);font-weight:600;">Alunos</a> para adicionar.</div>
            </div>
          </div>

        </div>
        ${Components.footer()}
      </div>
    `;

    initSelects();

    function onContextChange() { render(); }

    function changeNeg(numero, delta) {
      const { turma, materia } = getCurrentContext();
      Store.updateNegativo(turma, materia, numero, delta);
      render();
    }

    function resetAll() {
      if (!confirm('Zerar todos os negativos desta turma?')) return;
      const { turma, materia } = getCurrentContext();
      const students = Store.getStudents(turma, materia);
      students.forEach(s => s.negativos = 0);
      Store.setStudents(turma, materia, students);
      render();
    }

    function render() {
      const { turma, materia } = getCurrentContext();
      const students = Store.getStudents(turma, materia);
      const tbody = document.getElementById('tbodyNegativos');
      const empty = document.getElementById('emptyState');

      const totalNegs = students.reduce((s, a) => s + a.negativos, 0);
      const limpos = students.filter(s => s.negativos === 0).length;
      document.getElementById('stat-total').textContent = students.length;
      document.getElementById('stat-negs').textContent = totalNegs;
      document.getElementById('stat-limpos').textContent = limpos;

      if (students.length === 0) {
        tbody.innerHTML = '';
        empty.style.display = '';
        return;
      }
      empty.style.display = 'none';

      tbody.innerHTML = students.map(s => `
        <tr>
          <td style="font-weight:700;color:var(--dark);">${s.numero}</td>
          <td>${s.nome}</td>
          <td style="text-align:center;">
            <span style="display:inline-block;min-width:2rem;font-weight:800;font-size:1.2rem;color:${s.negativos > 0 ? 'var(--red)' : 'var(--gray-300)'};">${s.negativos}</span>
          </td>
          <td style="text-align:center;">
            <div style="display:inline-flex;gap:6px;">
              <button onclick="changeNeg(${s.numero},-1)" class="btn-icon-sm" style="background:var(--gray-100);color:var(--gray-500);" title="Remover negativo">−</button>
              <button onclick="changeNeg(${s.numero},1)" class="btn-icon-sm" style="background:var(--light);color:var(--green);" title="Adicionar negativo">+</button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    render();
  </script>
</body>
</html>
