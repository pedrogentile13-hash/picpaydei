<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Negativos — picpay.de.i</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="../assets/js/firebase-config.js"></script>
  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/auth-guard.js"></script>

  <div id="app" style="visibility:hidden;"></div>

  <script>
    document.getElementById('app').innerHTML =
      Components.sidebar('negativos') +
      '<div class="main-content">' +
        Components.topbar('Negativos') +
        '<div class="page-container">' +

          '<div class="summary-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:24px;">' +
            '<div class="summary-card">' +
              '<div class="label">Alunos na Turma</div>' +
              '<div class="value dark" id="stat-total">0</div>' +
            '</div>' +
            '<div class="summary-card">' +
              '<div class="label">Total de Negativos</div>' +
              '<div class="value red" id="stat-negs">0</div>' +
            '</div>' +
            '<div class="summary-card">' +
              '<div class="label">Alunos Limpos</div>' +
              '<div class="value green" id="stat-limpos">0</div>' +
            '</div>' +
          '</div>' +

          '<div class="card">' +
            '<div class="card-header">' +
              '<h3>Gestão de Negativos</h3>' +
              '<div style="display:flex;gap:8px;">' +
                '<button class="btn btn-outline" onclick="openMultiSelector()" style="font-size:0.75rem;padding:6px 14px;">Selecionar</button>' +
                '<button class="btn btn-outline" onclick="resetAll()" style="font-size:0.75rem;padding:6px 14px;">Zerar Todos</button>' +
              '</div>' +
            '</div>' +
            '<div class="table-container">' +
              '<table>' +
                '<thead>' +
                  '<tr>' +
                    '<th style="text-align:left;">Nº</th>' +
                    '<th style="text-align:left;">Nome</th>' +
                    '<th style="text-align:center;">Negativos</th>' +
                    '<th style="text-align:center;">Impacto na Quali</th>' +
                    '<th style="text-align:center;">Ações</th>' +
                  '</tr>' +
                '</thead>' +
                '<tbody id="tbodyNegativos"></tbody>' +
              '</table>' +
              '<div id="emptyState" class="empty-state">Nenhum aluno cadastrado. Vá em <a href="alunos.html" style="color:var(--green);font-weight:600;">Alunos</a> para adicionar.</div>' +
            '</div>' +
          '</div>' +

          '<p style="margin-top:12px;font-size:0.75rem;color:var(--gray-400);">' +
            '* Cada negativo reduz 0.1 da nota Qualitativa no Boletim deste bimestre.' +
          '</p>' +

        '</div>' +
        Components.footer() +
      '</div>' +

      // Multi-selector Modal
      '<div id="multiSelectorModal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:1000;align-items:center;justify-content:center;padding:20px;">' +
        '<div style="background:#fff;border-radius:var(--radius-lg);max-width:500px;width:100%;max-height:80vh;overflow-y:auto;box-shadow:var(--shadow-lg);">' +
          '<div style="padding:20px;border-bottom:1px solid var(--gray-100);">' +
            '<h2 style="margin:0 0 4px;font-size:1.2rem;font-weight:800;color:var(--dark);">Selecionar Alunos</h2>' +
            '<p style="margin:0;font-size:0.85rem;color:var(--gray-500);">Escolha os alunos para adicionar negativos</p>' +
          '</div>' +
          '<div style="padding:20px;">' +
            '<div style="display:flex;gap:8px;margin-bottom:16px;">' +
              '<button class="btn btn-outline" onclick="toggleAllSelector()" style="flex:1;padding:10px;">Selecionar Todos</button>' +
              '<button class="btn btn-outline" onclick="clearAllSelector()" style="flex:1;padding:10px;">Desselecionar Tudo</button>' +
            '</div>' +
            '<div id="studentCheckboxes" style="display:flex;flex-direction:column;gap:8px;max-height:400px;overflow-y:auto;"></div>' +
          '</div>' +
          '<div style="padding:20px;border-top:1px solid var(--gray-100);display:flex;gap:8px;">' +
            '<div style="display:flex;align-items:center;gap:8px;flex:1;">' +
              '<label style="font-size:0.85rem;color:var(--gray-600);">Quantidade:</label>' +
              '<input type="number" id="selectorQuantidade" value="1" min="1" max="10" style="width:60px;padding:6px;border:1px solid var(--gray-200);border-radius:6px;font-weight:600;" />' +
            '</div>' +
            '<button class="btn btn-primary" onclick="applySelectorNeg()">Adicionar</button>' +
            '<button class="btn btn-outline" onclick="closeMultiSelector()">Cancelar</button>' +
          '</div>' +
        '</div>' +
      '</div>';

    initSelects();

    function onContextChange() { render(); }

    function changeNeg(numero, delta) {
      var ctx = getCurrentContext();
      Store.updateNegativo(ctx.turma, ctx.materia, ctx.bimestre, numero, delta);
      render();
    }

    function resetAll() {
      if (!confirm('Zerar todos os negativos desta turma neste bimestre?')) return;
      var ctx = getCurrentContext();
      var students = Store.getStudents(ctx.turma, ctx.materia, ctx.bimestre);
      students.forEach(function(s) { s.negativos = 0; });
      Store.setStudents(ctx.turma, ctx.materia, ctx.bimestre, students);
      render();
    }

    function buildRow(s) {
      var impacto = (s.negativos * 0.1).toFixed(1);
      var negColor = s.negativos > 0 ? 'var(--red)' : 'var(--gray-300)';
      var impColor = s.negativos > 0 ? 'var(--red)' : 'var(--gray-400)';

      return '<tr>' +
        '<td style="font-weight:700;color:var(--dark);">' + s.numero + '</td>' +
        '<td>' + s.nome + '</td>' +
        '<td style="text-align:center;">' +
          '<span style="display:inline-block;min-width:2rem;font-weight:800;font-size:1.2rem;color:' + negColor + ';">' + s.negativos + '</span>' +
        '</td>' +
        '<td style="text-align:center;font-size:0.8rem;font-weight:600;color:' + impColor + ';">' +
          '-' + impacto +
        '</td>' +
        '<td style="text-align:center;">' +
          '<div style="display:inline-flex;gap:6px;">' +
            '<button onclick="changeNeg(' + s.numero + ',-1)" class="btn-icon-sm" style="background:var(--gray-100);color:var(--gray-500);" title="Remover negativo">&minus;</button>' +
            '<button onclick="changeNeg(' + s.numero + ',1)" class="btn-icon-sm" style="background:var(--light);color:var(--green);" title="Adicionar negativo">+</button>' +
          '</div>' +
        '</td>' +
      '</tr>';
    }

    function render() {
      var ctx = getCurrentContext();
      var students = Store.getStudents(ctx.turma, ctx.materia, ctx.bimestre);
      var tbody = document.getElementById('tbodyNegativos');
      var empty = document.getElementById('emptyState');

      var totalNegs = students.reduce(function(sum, s) { return sum + s.negativos; }, 0);
      var limpos = students.filter(function(s) { return s.negativos === 0; }).length;
      document.getElementById('stat-total').textContent = students.length;
      document.getElementById('stat-negs').textContent = totalNegs;
      document.getElementById('stat-limpos').textContent = limpos;

      if (students.length === 0) {
        tbody.innerHTML = '';
        empty.style.display = '';
        return;
      }
      empty.style.display = 'none';

      tbody.innerHTML = students.map(buildRow).join('');
    }

    var selectedStudents = [];

    function openMultiSelector() {
      var ctx = getCurrentContext();
      var students = Store.getStudents(ctx.turma, ctx.materia, ctx.bimestre);
      selectedStudents = [];

      var checkboxHtml = students.map(function(s) {
        return '<label style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--gray-50);border-radius:8px;cursor:pointer;">' +
          '<input type="checkbox" value="' + s.numero + '" onchange="handleStudentCheckbox(this)" style="width:18px;height:18px;cursor:pointer;" />' +
          '<span style="flex:1;font-weight:600;color:var(--dark);">' + s.numero + ' - ' + s.nome + '</span>' +
        '</label>';
      }).join('');

      document.getElementById('studentCheckboxes').innerHTML = checkboxHtml;
      document.getElementById('multiSelectorModal').style.display = 'flex';
    }

    function closeMultiSelector() {
      document.getElementById('multiSelectorModal').style.display = 'none';
      selectedStudents = [];
    }

    function handleStudentCheckbox(checkbox) {
      var numero = parseInt(checkbox.value);
      if (checkbox.checked) {
        if (selectedStudents.indexOf(numero) === -1) {
          selectedStudents.push(numero);
        }
      } else {
        var idx = selectedStudents.indexOf(numero);
        if (idx !== -1) selectedStudents.splice(idx, 1);
      }
    }

    function toggleAllSelector() {
      var checkboxes = document.querySelectorAll('#studentCheckboxes input[type="checkbox"]');
      var allChecked = Array.from(checkboxes).every(function(cb) { return cb.checked; });
      checkboxes.forEach(function(cb) {
        cb.checked = !allChecked;
        handleStudentCheckbox(cb);
      });
    }

    function clearAllSelector() {
      document.querySelectorAll('#studentCheckboxes input[type="checkbox"]').forEach(function(cb) {
        cb.checked = false;
        handleStudentCheckbox(cb);
      });
    }

    function applySelectorNeg() {
      if (selectedStudents.length === 0) {
        alert('Selecione pelo menos um aluno');
        return;
      }
      var quantidade = parseInt(document.getElementById('selectorQuantidade').value) || 1;
      var ctx = getCurrentContext();

      selectedStudents.forEach(function(numero) {
        Store.updateNegativo(ctx.turma, ctx.materia, ctx.bimestre, numero, quantidade);
      });

      render();
      closeMultiSelector();
    }

    render();
    Store.loadFromCloud(function(success) { if (success) render(); });
  </script>
</body>
</html>
